<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one Famicom screen stacked over a status panel and a DQ-style message window. Deliberately single-theme (black CRT). */
:root{
  --bg:#000000; --fg:#fcfcfc; --dim:#bcbcbc; --mute:#7c7c7c;
  --red:#f83800; --gold:#f8b800; --sky:#3cbcfc; --green:#58d854; --pink:#f878f8; --blue:#6888fc;
  --pixel:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--pixel);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{max-width:560px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:10px}
#screen{position:relative;width:100%;aspect-ratio:256/160;max-width:100%;border:3px solid var(--fg);border-radius:4px;overflow:hidden;background:#000}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#gauges{position:absolute;left:1.5%;top:2%;width:31%;background:rgba(0,0,0,.6);border-radius:3px;padding:3px 5px;display:flex;flex-direction:column;gap:1px;font-size:clamp(8px,2.4vw,11px);line-height:1.15}
#gauges .g{display:flex;align-items:center;gap:4px;min-width:0}
#gauges span{flex:0 0 3.1em;color:var(--fg);white-space:nowrap}
#gauges i{flex:1;height:5px;border:1px solid var(--fg);position:relative;display:block;min-width:0;background:#000}
#gauges b{position:absolute;inset:0 auto 0 0;display:block}
#gauges .low span{color:var(--red);animation:blink .6s steps(1) infinite}
.box{border:3px solid var(--fg);border-radius:8px;padding:10px 12px;background:var(--bg);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--mute)}
#hud{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;padding-block:6px}
#hud .row{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between}
#hud .big{font-size:17px}
#hud .small{font-size:13px;color:var(--dim)}
#hud .warn{color:var(--red)}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px}
.bar{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.bar label{flex:0 0 auto;width:3.2em;color:var(--dim)}
.bar i{flex:1;height:8px;border:1px solid var(--fg);display:block;position:relative;min-width:0}
.bar b{position:absolute;inset:0 auto 0 0;display:block;width:50%}
#win{min-height:120px;display:flex;flex-direction:column;gap:6px}
.w-title{color:var(--gold);font-size:16px;text-wrap:balance}
.w-text{white-space:pre-line}
.w-live{color:var(--sky);font-variant-numeric:tabular-nums}
.w-list{display:flex;flex-direction:column;gap:2px}
.opt{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:3px 4px 3px 22px;position:relative;border-radius:3px}
.opt .note{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.opt.sel::before{content:"▶";position:absolute;left:4px;animation:blink 0.8s steps(1) infinite}
.opt.sel{background:#1c1c3c}
.opt:focus-visible{outline:2px solid var(--gold)}
.opt[disabled]{color:var(--mute);cursor:default}
.w-slider{align-items:center;cursor:default;padding-block:6px}
.w-slider .lbl{white-space:nowrap}
.w-slider input{flex:1;min-width:0;height:28px;margin:0;accent-color:var(--gold);cursor:pointer;touch-action:pan-x}
.w-slider .note{min-width:2.5em;text-align:right}
.opt small{font-size:12px;color:var(--green)}
.opt[disabled] small{color:var(--mute)}
.w-sec{font-size:12px;color:var(--gold);letter-spacing:0.05em;padding:6px 4px 0;border-bottom:1px dashed var(--mute)}
.w-desc{color:var(--dim);font-size:13px;border-top:1px dashed var(--mute);padding-top:5px;min-height:1.5em}
.log p{margin:0}
.log p:last-child{color:var(--fg)}
.log p:not(:last-child){color:var(--mute)}
#ctrl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
#ctrl button{all:unset;cursor:pointer;border:2px solid var(--fg);border-radius:4px;padding:6px 0;font-size:clamp(10px,3vw,13px);letter-spacing:-.04em;text-align:center;white-space:nowrap;overflow:hidden;min-width:0}
#ctrl button.on{background:var(--fg);color:var(--bg)}
#ctrl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.help{font-size:12px;color:var(--mute)}
a{color:var(--sky)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.opt.sel::before{animation:none}}
@media (max-width:420px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}body{font-size:14px}}
</style>

<div id="app">
  <div id="screen"><canvas id="cv" width="256" height="160" aria-label="ゲーム画面"></canvas>
    <div id="gauges" hidden>
      <div class="g"><span>体力</span><i><b id="g-sta" style="background:var(--green)"></b></i></div>

    <button id="c-norm" data-pace="normal">ふつう</button>
    <button id="c-hard" data-pace="hard">がんばる</button>

  <div id="win" class="box"></div>
  <div class="help">操作：↑↓で選ぶ、Z / Enter で決定、X / Esc で戻る。走行中は 1・2・3 でペース、E で食べる、F で早送り。コースは作者のブログ記録をもとにした概略です（標高・一部地点は推定）。</div>
</div>

function pickShelf(chain){if(chain==="pbp")return [...STORE.pbp].sort(()=>Math.random()-0.5).slice(0,8).concat(STORE.goods);const out=[];
  for(const [k,n] of SHELF){const a=[...STORE[k]];for(let i=0;i<n&&a.length;i++)out.push(a.splice(Math.floor(Math.random()*a.length),1)[0])}
  if(STORE[chain]&&Math.random()<0.6)out.unshift(STORE[chain][Math.floor(Math.random()*STORE[chain].length)]);
  return [...out,...STORE.goods]}

function mealCheck(){

  for(const [id,label,a,b] of MEAL_TIMES){if(d<a||d>=b)continue;const key=day+id;if(R.meals[key])continue;R.meals[key]=true;
    if(R.t-(R.lastMeal??-999)<90)return false;
    const soon=R.events.slice(R.evIdx).find(e=>e.type==="sight"&&e.fx&&e.fx.hunger>=30&&e.km-R.km<12);if(soon)return false;

      const seated=m=>({...m.fx,stamina:(m.fx.stamina||0)+Math.round(m.min*1.2)});
      return menu({title:`${label}の時間`,text:`${label}どき。フランスの村の店の前を通りかかった。\nゴールのクローズまで あと${dur(R.course.start+R.course.limit-R.t)}　満腹 ${Math.round(R.hunger)}`,items:[...PM.map(m=>({label:`${m.name}　<small>${describeFx(seated(m))}</small>`,note:`${yen(m.price)}・${m.min}分`,disabled:P.money<m.price,fn:()=>{R.t+=m.min;P.money-=m.price;fx(seated(m));R.lastMeal=R.t;log(`${m.name}。メルシー！`)}})),{label:"コントロールまでがまん",fn:()=>{}}]}),true}

    pool.push({name:id==="breakfast"?"近くのハンバーガーショップの朝メニュー":"近くのハンバーガーショップ",min:15,price:700,crowd:0.35,fx:{hunger:40,spirit:5,weight:0.1},hint:"早い。ただし混んでいることも。"});

      ...pool.map(m=>({label:`${m.name}　<small>${describeFx(seated(m))}</small>`,note:`${yen(m.price)}・${m.min+(m.detour||0)}分`,disabled:P.money<m.price,desc:m.hint||"",
        fn:()=>{

/* ===== 音（BQA）：ファミコン風の自作の曲と効果音。録音のファイルは使わず、Web Audio で鳴らす =====
   Ride on Quest の音の仕組み（sequencer・synth・music）を1つにまとめて移した（同じ作者の作品）。
   ・曲は「音符の並びのデータ」（BQA_SONGS）。"G4:1 B4:0.5 r:1" … 音名:長さ（拍。省くと1）、r は休み。ノイズの声部は k・s・h・o（キック・スネア・ハイハット・開いたハイハット）
   ・声：矩形波（pulse。デューティ比 12.5%・25%・50%）、三角波（tri）、ノイズ（noise）
   ・場面 → 曲は BQA.scene(名前)。曲が変わるときだけ、短いフェードで切り替える
   ・BGM と効果音は音量・オン・オフを別々に持つ（localStorage に保存）
   ・ブラウザの決まりで、最初のクリックかキーまでは音が出ない（そのときに鳴り始める） */
const BQA = (() => {

  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }, DRUM = { k: 36, s: 38, h: 42, o: 46 };
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  function noteNum(name) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
    if (!m) throw new Error('音名が正しくありません: ' + name);
    return (+m[3] + 1) * 12 + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const noteName = n => NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  function parseSeq(text) {
    const notes = []; let b = 0;
    for (const tok of String(text).trim().split(/\s+/)) {
      if (!tok || tok === '|') continue;
      const [nm, ds] = tok.split(':'), d = ds === undefined ? 1 : +ds;
      if (!(d > 0)) throw new Error('長さが正しくありません: ' + tok);

      const p = parseSeq(t.seq);

      return { ch: t.ch, vol: t.vol == null ? 1 : t.vol, duty: t.duty || 0.5, notes: p.notes };
    });

  }
  const start = (song, time) => ({ beat: 0, time, bpm: song.bpm, done: false });
  // until（秒）より前に鳴る音を取り出す。st.beat は次に取り出す拍、st.time はその拍が鳴る時刻
  function step(st0, song, until) {
    const st = { ...st0 }, events = [];
    while (!st.done && st.time < until) {
      const room = st.beat + (until - st.time) * st.bpm / 60, stop = Math.min(room, song.length);
      song.tracks.forEach(t => {
        for (const n of t.notes) if (n.b >= st.beat && n.b < stop) events.push({ time: st.time + (n.b - st.beat) * 60 / st.bpm, ch: t.ch, n: n.n, d: n.d * 60 / st.bpm, v: t.vol, duty: t.duty });
      });
      st.time = stop === room ? until : st.time + (stop - st.beat) * 60 / st.bpm;
      st.beat = stop;
      if (st.beat >= song.length - 1e-9) { if (song.loop) st.beat = 0; else st.done = true; }
    }
    return { events, state: st };
  }

  /* ---------- 合成器（AudioContext に触るのはここだけ） ---------- */
  let ctx = null, comp = null;
  const bus = {}, waves = {}, LEVEL = { pulse: 0.16, tri: 0.3, noise: 0.14 };
  let noiseBuf = null;
  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const master = ctx.createGain(); master.gain.value = 0.9;
    comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);   // 重なっても割れないように
    for (const name of ['bgm', 'sfx']) { bus[name] = ctx.createGain(); bus[name].gain.value = 0; bus[name].connect(master); }
    return ctx;
  }
  const ready = () => !!ctx && ctx.state === 'running';
  function pulseWave(d) {
    if (waves[d]) return waves[d];
    const N = 48, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
    for (let k = 1; k <= N; k++) { re[k] = Math.sin(2 * Math.PI * k * d) / (Math.PI * k); im[k] = (1 - Math.cos(2 * Math.PI * k * d)) / (Math.PI * k); }
    return (waves[d] = ctx.createPeriodicWave(re, im));
  }
  function noise() {
    if (noiseBuf) return noiseBuf;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const a = noiseBuf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  // 1音を鳴らす。ev：{ time, ch, n, d（秒）, v, duty }、out：つなぐ先
  function note(ev, out) {
    const t = Math.max(ev.time, ctx.currentTime), v = ev.v == null ? 1 : ev.v;
    if (ev.ch === 'noise') return drum(ev.n, t, v, out);
    const o = ctx.createOscillator(), g = ctx.createGain(), dur = Math.max(0.03, ev.d * 0.92), peak = LEVEL[ev.ch === 'tri' ? 'tri' : 'pulse'] * v, sus = ev.ch === 'tri' ? 1 : 0.7;
    if (ev.ch === 'tri') o.type = 'triangle'; else o.setPeriodicWave(pulseWave(ev.duty || 0.5));
    o.frequency.value = hz(ev.n);
    const dec = Math.min(dur, 0.12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + 0.004); g.gain.linearRampToValueAtTime(peak * sus, t + 0.004 + dec);
    if (dur > 0.004 + dec) g.gain.linearRampToValueAtTime(peak * sus, t + dur);
    g.gain.linearRampToValueAtTime(0, t + dur + 0.025);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.06);
    o.onended = () => { try { g.disconnect(); } catch (_) {} };
  }
  function drum(n, t, v0, out) {
    const v = LEVEL.noise * v0, g = ctx.createGain(); g.connect(out);
    if (n === 36) {   // キック：三角波の音程が急に落ちる
      const o = ctx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
      g.gain.setValueAtTime(v * 3.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); o.start(t); o.stop(t + 0.2); o.onended = () => { try { g.disconnect(); } catch (_) {} };
      return;
    }
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), len = n === 38 ? 0.13 : n === 46 ? 0.16 : 0.045;
    src.buffer = noise(); src.loop = true;
    f.type = n === 38 ? 'bandpass' : 'highpass'; f.frequency.value = n === 38 ? 1800 : 7000;
    g.gain.setValueAtTime(v * (n === 38 ? 2.4 : 1.4), t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.connect(f); f.connect(g); src.start(t, Math.random() * 0.5); src.stop(t + len + 0.02);
    src.onended = () => { try { g.disconnect(); } catch (_) {} };
  }
  const makeGain = (name, v) => { const g = ctx.createGain(); g.gain.value = v; g.connect(bus[name]); return g; };
  function fade(g, to, sec) { const t = ctx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(to, t + Math.max(0.005, sec)); }
  function kill(g, sec) { fade(g, 0, sec); setTimeout(() => { try { g.disconnect(); } catch (_) {} }, sec * 1000 + 100); }

  /* ---------- BGM の操作盤と、設定（localStorage） ---------- */
  const KEY = (typeof SAVE_KEY !== 'undefined' ? SAVE_KEY : 'brevet-quest') + '-sound';
  const opt = Object.assign({ bgmOn: true, sfxOn: true, bgmVol: 60, sfxVol: 70 }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (_) { return {}; } })());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(opt)); } catch (_) {} };
  const gainOf = (on, v) => (on ? Math.pow(Math.max(0, Math.min(100, v)) / 100, 2) : 0);   // 音量は2乗くらいが耳にちょうどよい
  function applyVolume() {
    if (!ctx) return;
    bus.bgm.gain.setTargetAtTime(gainOf(opt.bgmOn, opt.bgmVol), ctx.currentTime, 0.02);
    bus.sfx.gain.setTargetAtTime(gainOf(opt.sfxOn, opt.sfxVol), ctx.currentTime, 0.02);
  }
  const compiled = {};
  let want = null, cur = null, paused = false, sfxOut = null;
  const FADE = 0.35, LOOKAHEAD = 0.15;
  function pump() {
    if (!ready() || paused) return;
    const t = ctx.currentTime;
    if (want !== (cur ? cur.id : null)) {
      if (cur) kill(cur.gain, FADE);
      cur = null;
      if (want && compiled[want]) { const gain = makeGain('bgm', 0); fade(gain, 1, FADE); cur = { id: want, song: compiled[want], st: start(compiled[want], t + 0.05), gain }; }
    }
    if (!cur) return;
    if (cur.st.time < t) cur.st = { ...cur.st, time: t + 0.05 };   // 画面が止まっていたら、いまから続ける
    const r = step(cur.st, cur.song, t + LOOKAHEAD);
    cur.st = r.state;
    for (const ev of r.events) note(ev, cur.gain);
  }
  function unlock() {
    const c = ensure(); if (!c) return;
    (c.state === 'running' ? Promise.resolve() : c.resume()).then(() => { applyVolume(); pump(); }, () => {});
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true); addEventListener('touchstart', unlock, true);
    setInterval(pump, 25);
  }

  return {
    noteNum, noteName, parseSeq, compile, step, start, DRUM,
    // 曲のデータを登録する（BQA_SONGS）
    load(songs) { for (const id of Object.keys(songs)) compiled[id] = compile(songs[id]); },
    songs: compiled,
    // 場面の曲（曲の ID か null）。同じ曲なら何もしない
    scene(id) { want = id && compiled[id] ? id : null; pump(); },
    current: () => (cur ? cur.id : null),
    pause(p) { paused = !!p; if (p && cur) { kill(cur.gain, 0.05); cur = null; } },
    // 効果音（BQA_SFX の ID）。BGM とは別のバス
    sfx(id) {
      const def = BQA_SFX[id];
      if (!def || !ready() || !opt.sfxOn) return;
      if (!sfxOut) sfxOut = makeGain('sfx', 1);
      const sec = 60 / def.bpm, t0 = ctx.currentTime + 0.01;
      for (const tr of def.tracks) for (const n of parseSeq(tr.seq).notes) note({ time: t0 + n.b * sec, ch: tr.ch, n: n.n, d: n.d * sec, v: tr.vol == null ? 1 : tr.vol, duty: tr.duty || 0.5 }, sfxOut);
    },
    // 任意の高さの短い音（f：Hz、d：秒）。前の beep() の代わり
    tone(f, d = 0.05, duty = 0.5, v = 0.7) {
      if (!ready() || !opt.sfxOn) return;
      if (!sfxOut) sfxOut = makeGain('sfx', 1);
      note({ time: ctx.currentTime + 0.005, ch: 'pulse', n: 69 + 12 * Math.log2(f / 440), d, v, duty }, sfxOut);
    },
    // 設定：{ bgmOn, sfxOn, bgmVol, sfxVol }（0〜100）。保存する
    set(o) { Object.assign(opt, o); save(); applyVolume(); },
    get: () => ({ ...opt }),
  };
})();

/* ===== 曲のデータ（すべてオリジナル。特定の曲の旋律・和音進行に似せない） =====
   場面：title（タイトル）・hub（自宅）・day（走行・昼）・night（走行・夜）・rain（雨）・pc（コンビニの PC）・
   race（レース・グラベル）・pbp（PBP。フランスの3拍子）・goal（完走。1回）・dnf（リタイア。1回）
   和音は「C」「Am」「B」のような名前で書き、伴奏（分散和音・低音）は下の小物が作る。 */
const BQA_SONGS = (() => {
  const N = BQA.noteNum, NM = BQA.noteName, bars = (...b) => b.join(' '), rep = (s, n) => Array(n).fill(s).join(' ');
  // 和音の名前 → 中音域の3音と、低音（根音・5度・オクターブ）
  const ROOT = { C: 'C3', D: 'D3', E: 'E2', F: 'F2', G: 'G2', A: 'A2', B: 'B2', Bb: 'Bb2', Eb: 'Eb3' };
  function chord(name) {
    const m = /^([A-G]b?)(m?)$/.exec(name), r = N(ROOT[m[1]]), third = m[2] ? 3 : 4;
    let mid = r + 12; while (mid < N('G3')) mid += 12; while (mid > N('C4') + 2) mid -= 12;   // 中音域は G3〜D4 から
    return { t: [mid, mid + third, mid + 7].map(NM), b: NM(r), f: NM(r + 7), o: NM(r + 12) };
  }
  const C = s => s.trim().split(/\s+/).map(chord);
  const arp = (cs, pat, d) => cs.map(c => pat.map(i => `${c.t[i]}:${d}`).join(' ')).join(' ');                 // 分散和音（1つの和音で pat の長さ×d 拍）
  const ride = cs => cs.map(c => `${c.b}:0.5 ${c.b}:0.5 ${c.f}:0.5 ${c.b}:0.5 ${c.b}:0.5 ${c.o}:0.5 ${c.f}:0.5 ${c.b}:0.5`).join(' ');   // 8分の低音（ペダルを回す感じ）
  const walk = cs => cs.map(c => `${c.b}:1 ${c.f}:1 ${c.o}:1 ${c.f}:1`).join(' ');
  const longb = cs => cs.map(c => `${c.b}:2 ${c.f}:2`).join(' ');
  const ROCK = 'k:0.5 h:0.5 s:0.5 h:0.5 k:0.5 k:0.5 s:0.5 h:0.5', FILL = 'k:0.5 h:0.5 s:0.5 h:0.5 s:0.25 s:0.25 s:0.25 s:0.25 s:0.5 o:0.5';
  const EASY = 'k:1 h:1 s:1 h:1', SOFT = 'r:1 h:1 r:1 h:1';

  /* 1. タイトル：ブルベの朝、出発の高揚（C メジャー、120 BPM、16 小節＝32秒） */

        'B4:1 D5:1 G5:1', 'G#5:1.5 F#5:0.5 E5:1', 'A5:1 C6:1 A5:1', 'E5:3', 'F#5:1 A5:1 D6:1', 'C6:1.5 B5:0.5 A5:1', 'B5:1 G5:1 D5:1', 'G5:2 r:1') },
      { ch: 'pulse', duty: 0.25, vol: 0.4, seq: bC.map(c => `r:1 ${c.t[1]}:0.5 r:0.5 ${c.t[2]}:0.5 r:0.5`).join(' ') },   // ブン・チャッ・チャッ

  /* 9. 完走：ファンファーレ（C メジャー、140 BPM、4 小節。1回鳴らして止める） */
  const goal = {

    tracks: [
      { ch: 'pulse', duty: 0.25, seq: bars('G4:0.5 C5:0.5 E5:0.5 G5:1.5 E5:0.5 G5:0.5', 'C6:2 G5:1 E5:1', 'F5:1 A5:1 C6:1 F6:1', 'E6:0.5 D6:0.5 E6:0.5 G6:0.5 C7:2') },
      { ch: 'pulse', duty: 0.5, vol: 0.5, seq: bars('E4:0.5 G4:0.5 C5:0.5 E5:1.5 C5:0.5 E5:0.5', 'E5:2 E5:1 C5:1', 'C5:1 F5:1 A5:1 C6:1', 'C6:0.5 B5:0.5 C6:0.5 D6:0.5 E6:2') },
      { ch: 'tri', seq: bars('C3:2 G2:2', 'C3:2 E3:2', 'F2:2 A2:2', 'G2:1 G2:1 C3:2') },

  /* 10. リタイア：静かに終わる（A マイナー、80 BPM、2 小節。1回鳴らして止める） */

})();

// 音の設定の画面（タイトルとひと休みのメニューから）。音楽・効果音のオン・オフと音量（0〜100）。保存は localStorage（SAVE_KEY+"-sound"）

/* ================= UI (message window) ================= */
const UI={open:false,items:[],idx:0,title:"",text:"",live:null,cancel:null};
function menu(o){
  const prev=UI.idx;
  Object.assign(UI,{open:true,title:o.title||"",text:o.text||"",items:o.items||[],live:o.live||null,cancel:o.cancel||null});
  UI.idx=o.keep?Math.min(prev,UI.items.length-1):Math.max(0,UI.items.findIndex(i=>!i.disabled));
  renderWin();
}
function say(title,text,fn){menu({title,text,items:[{label:"OK",fn}],cancel:fn})}
function renderWin(){
  const w=$("#win");
  if(!UI.open){renderIdle();return}
  let h="";
  if(UI.title)h+=`<div class="w-title">${UI.title}</div>`;
  if(UI.text)h+=`<div class="w-text">${UI.text}</div>`;
  if(UI.live)h+=`<div class="w-live" id="w-live">${UI.live()}</div>`;
  h+=`<div class="w-list">`;
  UI.items.forEach((it,i)=>{if(it.header){h+=`<div class="w-sec">${it.label}</div>`;return}
    if(it.slider){const v=it.value();h+=`<div class="opt w-slider${i===UI.idx?" sel":""}" data-i="${i}"><span class="lbl">${it.label}</span><input type="range" min="0" max="100" step="5" value="${v}" data-s="${i}" aria-label="${it.label}"><span class="note">${v}</span></div>`;return}
    h+=`<button class="opt${i===UI.idx?" sel":""}" data-i="${i}"${it.disabled?" disabled":""}><span class="lbl">${it.label}</span>${it.note?`<span class="note">${it.note}</span>`:""}</button>`});
  h+=`</div>`;
  if(UI.items.some(i=>i.desc))h+=`<div class="w-desc">${(UI.items[UI.idx]&&UI.items[UI.idx].desc)||""}</div>`;
  w.innerHTML=h;
}
function renderIdle(){
  const w=$("#win");
  if(G.mode==="ride"&&R){w.innerHTML=`<div class="log">${R.log.slice(-5).map(l=>`<p>${l}</p>`).join("")}</div>`}
  else w.innerHTML="";
}
function choose(i){
  const it=UI.items[i];if(!it||it.disabled||it.slider)return;
  SFX.sel();UI.open=false;
  if(it.fn)it.fn();
  if(!UI.open)renderIdle();
}
function moveSel(d){
  if(!UI.items.length)return;
  let i=UI.idx;
  for(let n=0;n<UI.items.length;n++){i=(i+d+UI.items.length)%UI.items.length;if(!UI.items[i].disabled)break}
  UI.idx=i;renderWin();BQA.sfx("sel");
}
$("#win").addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)choose(+b.dataset.i)});
// スライダー：動かしている間は値だけ書き換える（窓は作り直さない）
function slideTo(i,v){const it=UI.items[i];if(!it||!it.slider)return;v=clamp(Math.round(v/5)*5,0,100);it.set(v);const s=$("#win").querySelector(`input[data-s="${i}"]`);if(s){s.value=v;s.nextElementSibling.textContent=v}}
$("#win").addEventListener("input",e=>{const s=e.target.closest("input[data-s]");if(s)slideTo(+s.dataset.s,+s.value)});
$("#win").addEventListener("change",e=>{const s=e.target.closest("input[data-s]");if(s){const it=UI.items[+s.dataset.s];if(it&&it.done)it.done()}});
$("#win").addEventListener("mouseover",e=>{const b=e.target.closest(".opt");if(b&&!b.disabled&&+b.dataset.i!==UI.idx){UI.idx=+b.dataset.i;renderWin()}});
addEventListener("keydown",e=>{
  if(UI.open){
    if(e.key==="ArrowDown"){moveSel(1);e.preventDefault()}
    else if(e.key==="ArrowUp"){moveSel(-1);e.preventDefault()}
    else if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&UI.items[UI.idx]&&UI.items[UI.idx].slider){const it=UI.items[UI.idx];slideTo(UI.idx,it.value()+(e.key==="ArrowRight"?5:-5));if(it.done)it.done();e.preventDefault()}
    else if(["Enter"," ","z","Z"].includes(e.key)){choose(UI.idx);e.preventDefault()}
    else if(["Escape","x","X"].includes(e.key)&&UI.cancel){SFX.sel();UI.open=false;UI.cancel();if(!UI.open)renderIdle()}
    return;
  }
  if(G.mode==="ride"){
    if(e.key==="1")setPace("slow");else if(e.key==="2")setPace("normal");else if(e.key==="3")setPace("hard");
    else if(e.key==="e"||e.key==="E")eatMenu();
    else if(e.key==="f"||e.key==="F")toggleFF();
    else if(e.key==="Escape")pauseMenu();
  }
});

/* ================= GAME STATE ================= */
const G={mode:"title",scroll:0,crank:0,ff:1,bg:{scen:"sea",tod:5*60+10,speed:14}};
let R=null;
const RATE=4;      // ride: game minutes per real second (×1)


function bikeOf(){return BIKES[P.bike]}
function looks(){return Object.assign({jersey:"#f8b800",helmet:"#fcfcfc",frames:{}},P.looks||{})}
function frameColor(){const L=looks();return L.frames[P.bike]||bikeOf().color}
function partStat(){const s={w:0,aero:1,climb:1,comfort:1,punct:1,sealant:false};
  for(const sl in PARTS){const o=PARTS[sl].opts.find(x=>x.id===P.parts[sl]);if(!o)continue;s.w+=o.w||0;s.aero*=o.aero||1;s.climb*=o.climb||1;s.comfort*=o.comfort||1;s.punct*=o.punct||1;if(o.sealant)s.sealant=true}
  return s}
function bikeWeight(){return bikeOf().weight+partStat().w}
function bestLight(){let b=null;for(const g of GEAR)if(g.light&&P.gear[g.id]&&(!b||g.light.hours>b.light.hours))b=g;return b}
// BRM/AJ rules: bell, helmet, front light, steady rear light and reflective wear for every distance;
// 400km and up also needs two front lights fixed to the bike and a rear light on the helmet.
function frontLights(){return GEAR.filter(g=>g.light&&P.gear[g.id]).sort((a,b)=>b.light.hours-a.light.hours)}
function missingGear(kind,cls){
  const m=[];if(!P.gear.helmet)m.push("ヘルメット");
  if(kind!=="brm")return m;
  if(!P.gear.bell)m.push("ベル");
  const n=frontLights().length;if(n<1)m.push("前照灯");else if(cls>=400&&n<2)m.push("2灯目の前照灯（400km以上）");
  if(!(P.gear.rear||P.gear.radar))m.push("尾灯");
  if(!P.gear.vest)m.push("反射ベスト");
  if(cls>=400&&!P.gear.helmet_tail)m.push("ヘルメット用尾灯（400km以上）");
  return m}
function hasRequired(){return !missingGear("brm",200).length}
function packCap(){return P.gear.bag?5:2}
function packWeight(p){return PACK.reduce((s,it)=>s+(p[it.id]||0)*it.w*(it.needs&&WEAR_NAMES[it.needs]?tierOf(it.needs).w:1),0)}
function packCost(p){return PACK.reduce((s,it)=>s+(p[it.id]||0)*(it.cost||0),0)}
function lodgeCost(C){return C.lodges&&P.lodgePick>=0&&C.lodges[P.lodgePick]?C.lodges[P.lodgePick].price:0}

/* ================= COURSE MATH ================= */
function elevAt(km){const p=R.course.profile;if(km<=p[0][0])return p[0][1];
  for(let i=1;i<p.length;i++)if(km<=p[i][0]){const a=p[i-1],b=p[i];return a[1]+(b[1]-a[1])*(km-a[0])/(b[0]-a[0])}
  return p[p.length-1][1]}
// Hokkaido roads roll: small undulations on top of the coarse profile.
function rollAt(km){return 9*Math.sin(km*0.9)+5*Math.sin(km*2.3+1)}
function gradeAt(km){return clamp((elevAt(km+0.25)+rollAt(km+0.25)-elevAt(km-0.25)-rollAt(km-0.25))/500*100,-10,10)}
function headingAt(km){let h=0;for(const [k,d] of R.course.heading||[[0,0]])if(km>=k)h=d;return h}
// Headwind component in m/s (negative = tailwind). Wind picks up in the afternoon.
function windNow(){const d=tod(R.t)/60,s=R.windDay.spd*(0.75+0.45*Math.max(0,Math.sin(Math.PI*(d-7)/12)));
  let hw=s*Math.cos((R.windDay.dir-headingAt(R.km))*Math.PI/180);const gz=zone(R.course.gust||[],R.km);if(gz)hw+=gz[2];return hw}
function raining(){return !!zone(R.rainZones||[],R.km)}
function dhOn(){return P.parts.dh==="dh"&&!R.train.length&&Math.abs(gradeAt(R.km))<2.5}
const COMPASS=["北","北東","東","南東","南","南西","西","北西"];
function compass(d){return COMPASS[Math.round(((d%360)+360)%360/45)%8]}
function scenAt(km){let s=R.course.scenery[0][1];for(const [k,t] of R.course.scenery)if(km>=k)s=t;return s}
function zone(list,km){for(const z of list)if(km>=z[0]&&km<z[1])return z;return null}
function tod(t){return ((t%1440)+1440)%1440}
function isNight(t){const d=tod(t),C=R.course;return d<C.sunrise||d>=C.sunset}
function ambient(t,km){const C=R.course,d=tod(t)/60;const k=Math.max(0,Math.sin(Math.PI*(d-5)/14));return C.tNight+(C.tDay-C.tNight)*k-elevAt(km)*0.006}
function closeOf(km){const C=R.course;if(km>=C.dist-0.01)return C.start+C.limit;const h=km<=60?km/20+1:km/15;return C.start+Math.round(h*60)}
function controls(){return R.course.events.filter(e=>e.type==="pc"||e.type==="check")}
function nextControl(){return R.course.events.find(e=>(e.type==="pc"||e.type==="goal")&&e.km>R.km+0.001)}

// Long rides: legs get heavy with the kilometres (only proper sleep brings them back),
// and sleep debt piles up across days — the second night is far worse than the first.
function legFatigue(){return 1-Math.min(0.2,0.0004*Math.max(0,(R.legKm||0)-250))}
function awakeH(){return (R.t-(R.woke??R.course.start))/60}
function sleepDebt(){return Math.max(0,awakeH()-18)}
function speed(){
  const B=bikeOf(),S=partStat(),g=gradeAt(R.km),m=P.body+bikeWeight()+R.load,dh=dhOn();
  // the edge from training fades as the hours pile up — on day 3 everyone rides about the same
  const leg=P.leg>22?22+(P.leg-22)*Math.max(0.2,1-Math.max(0,(R.legKm||0)-150)/300):P.leg;
  let v=leg*B.aero*S.aero*(1-R.load*0.012)*(dh?1.06:1);
  // heavier riders suffer more on climbs, but punch through headwind a little better
  if(g>0)v=v/(1+g*0.2*Math.pow(m/80,1.5)*B.climb*S.climb*(1-P.climb));
  else if(g<0)v=Math.min(v*(1+(-g)*0.2)*B.descent,45);
  const hw=windNow();
  if(hw>0)v/=1+hw*0.04*Math.sqrt(80/m)*(dh?0.7:1)*(R.train.length?0.6:1);
  else v*=1-hw*0.025;
  if(R.course.snow)v*=0.8;
  if(R.course.vmax)v=Math.min(v,R.course.vmax); // spikes and snow: about 80% of the usual speed
  if(R.course.offroad)v*=(B.off||0.68)*(R.effort?0.85:1); // gravel: rolling resistance on top of the bike's off-road ability
  v*=(R.effort?{slow:1,normal:1.15,hard:1.3}:{slow:0.85,normal:1,hard:1.2})[R.pace];
  if(R.stamina<10)v*=0.6;else if(R.stamina<30)v*=0.85;
  if(R.sleepy>=85)v*=0.8;else if(R.sleepy>=65)v*=0.92;
  if(raining())v*=0.96;
  if(R.hunger<=0)v*=0.45;
  if(R.temp<30)v*=0.85;else if(R.temp>75)v*=0.92;
  if(R.spirit>=80)v*=1.03;else if(R.spirit<15)v*=0.8;else if(R.spirit<30)v*=0.9;else if(R.spirit<50)v*=0.95;
  if(isNight(R.t)){v*=R.light>0?R.lightNight:1;if(R.light<=0)v=Math.min(v,P.gear.helmet_light?15:10)}
  v*=legFatigue()*(R.limp||1);
  v*=1+0.06*R.train.length;
  if(R.course.pbp)v*=1.05; // thousands of riders: there is always a wheel to follow
  return Math.max(3,v);
}

/* ================= RIDE LOOP ================= */
function log(t){R.log.push(t);if(R.log.length>30)R.log.shift();if(!UI.open)renderIdle()}
function fx(o){if(!o)return;
  if(o.hunger)R.hunger=clamp(R.hunger+o.hunger,0,100);
  if(o.spirit)R.spirit=clamp(R.spirit+(o.spirit>0&&o.hunger?o.spirit*(trait().foodMul||1):o.spirit),0,R.spiMax||100);
  if(o.stamina)R.stamina=clamp(R.stamina+o.stamina,0,R.staMax);
  if(o.temp)R.temp=clamp(R.temp+o.temp*(o.hunger?0.6:1),0,100);
  if(o.sleepy)R.sleepy=clamp(R.sleepy+o.sleepy,0,100);
  if(o.weight)P.body=clamp(P.body+o.weight,55,95);
}
function rideTick(dt){
  let left=dt*RATE*G.ff*(R&&R.effort&&G.mode==="ride"?clamp(R.effH/12,0.15,1):1);
  while(left>0&&G.mode==="ride"&&!UI.open){const dm=Math.min(0.25,left);left-=dm;simStep(dm)}
}
function simStep(dm){
  const v=speed(),dk=v*dm/60,g=gradeAt(R.km),night=isNight(R.t);
  const ev=R.events[R.evIdx];
  if(ev&&R.km+dk>=ev.km){
    const frac=(ev.km-R.km)/dk;R.km=ev.km;R.t+=dm*frac;drain(dm*frac,g,night);R.evIdx++;trigger(ev);return;
  }
  R.km+=dk;R.legKm=(R.legKm||0)+dk;R.t+=dm;drain(dm,g,night);
  if(R.train.length&&Math.random()<dm/60*0.25)wishTalk();
  // train members leave
  {const m=R.train.find(x=>!x.cafe&&R.km>=x.until);if(m){trainSplit(m);return}}
  if(randomTrouble(dk,night))return;
  checkStates(night);
}
function drain(dm,g,night){
  const h=dm/60,B=bikeOf();
  const tr=R.train.length?1:0;
  const hw=windNow(),rain=raining(),amb=ambient(R.t,R.km);
  const base=R.effort?{slow:0.75,normal:1.15,hard:2.0}[R.pace]*100/R.course.dist*speed()*(R.staMax/100):{slow:-1,normal:6,hard:22}[R.pace],climb=R.effort?0:{slow:2.5,normal:4,hard:8}[R.pace];
  const heat=Math.max(0,R.temp-60)*0.3;
  R.stamina=clamp(R.stamina-h*(bikeOf().stam||1)*(base+Math.max(0,g)*climb+Math.max(0,hw)*(R.pace==="hard"?1.5:0.5)+heat*1.0)*(tr?0.85:1)*(100/R.staMax),0,R.staMax);
  R.hunger=clamp(R.hunger-h*(({slow:7,normal:11,hard:16}[R.pace])+Math.max(0,g)*1.0),0,100);
  let sp=(night?12:7)*B.comfort*partStat().comfort*(hasGear("jersey")?0.85-tierOf("jersey").t*0.02:1);
  const d=tod(R.t)/60;
  R.movH=(R.movH||0)+h;

// Sleep: a hotel restores far more than a roadside nap, and a nap leaves you cold.
function rest(min){R.woke=Math.min(R.t,(R.woke??R.course.start)+min*(min>=90?6:3));R.legKm=Math.max(0,(R.legKm||0)-min*(min>=90?1:0.3))}
function nap(min,msg){R.t+=min;rest(min);R.sleepy=clamp(R.sleepy-min*1.4,Math.min(70,sleepDebt()*1.5),100);fx({spirit:min*0.8,stamina:min*0.5,temp:-Math.min(15,min*0.4)});log(msg)}
function sleepHotel(hours,L){R.t+=hours*60;R.woke=R.t;R.legKm=Math.max(0,(R.legKm||0)-hours*50);R.sleepy=clamp(R.sleepy-hours*45,0,100);
  R.temp=50;fx({spirit:30+hours*15,stamina:hours*30,hunger:-hours*4});R.phone=100;if(R.lightType==="usb")R.light=R.lightMax;R.windOn=false;R.rainOn=false;
  log(`${L.name}で${hours}時間眠った。シャワーを浴びて、充電もできた。`)}
function lodgeEvent(L,i){
  const reserved=R.lodge===i,items=[],left=R.course.start+R.course.limit-R.t;
  const hoursOpt=(price)=>[2,3,4,6].map(hh=>({label:`${hh}時間眠る`,note:`起きたら ${fmt(tod(R.t+hh*60))}`,disabled:price>P.money,fn:()=>{P.money-=price;sleepHotel(hh,L)}}));
  if(reserved){items.push(...hoursOpt(0));items.push({label:"泊まらずに先へ進む",desc:"予約代は戻らない。",fn:()=>log(`${L.name}を素通りした。もったいない……。`)});
    return menu({title:`予約した宿：${L.name}`,text:`チェックインできる。何時間眠る？\nゴールのクローズまで あと${dur(left)}　眠気 ${Math.round(R.sleepy)}`,items})}
  const peak=/^\d{4}-0[78]/.test(R.course.ymd||""),vacant=Math.random()<(peak?0.4:0.75),price=L.price+2000;
  if(vacant)items.push(...hoursOpt(price).map(o=>({...o,note:`${yen(price)}・${o.note}`})));
  items.push({label:"近くの公園の東屋で仮眠",note:"30分",desc:"屋根の下のベンチで横になる。体は冷える。",fn:()=>nap(30,"公園の東屋のベンチで30分眠った。")});
  items.push({label:"小屋付きのバス停で眠る",note:"90分",desc:"風をしのげる待合小屋。90分眠ると、たまった眠気と脚の疲れがかなり抜ける。",fn:()=>nap(90,"小屋付きのバス停で90分眠った。始発のバスが来る前に出発。")});
  items.push({label:"そのまま進む",fn:()=>log(`${L.name}の前を通り過ぎた。`)});
  menu({title:L.name,text:`${vacant?"空室があるらしい。飛び込みで泊まる？":"飛び込みで聞いてみたけど、満室だった……。"}\nゴールのクローズまで あと${dur(left)}　眠気 ${Math.round(R.sleepy)}`,items});
}

/* ================= EVENTS ================= */
function trigger(ev){
  if(ev.type==="note"){if(ev.ifSleepy&&R.sleepy<ev.ifSleepy)return;log(ev.text);if(ev.spirit)fx({spirit:ev.spirit});if(ev.fx)fx(ev.fx);if(ev.alert){SFX.bad();return say(ev.alert,ev.text)}return}
  if(ev.type==="pc")return arrivePC(ev);
  if(ev.type==="check"){SFX.ok();return say(ev.name,ev.photo?`${ev.photo}\nブルベカードに通過時刻を書いた。(2分)`:"ブルベカードに通過を記録した。(2分)",()=>{R.t+=2;R.receipts[ev.km]=true;log(`${ev.name} 通過 ${fmt(R.t)}`)})}
  if(ev.type==="sight")return sightEvent(ev);
  if(ev.type==="friend")return friendEvent(ev);
  if(ev.type==="meet")return meetEvent(ev);
  if(ev.type==="lodge")return lodgeEvent(R.course.lodges[ev.li],ev.li);
  if(ev.type==="goal")return goal(ev);
}
function sightEvent(ev){
  const left=R.course.start+R.course.limit-R.t;
  // Eating at a restaurant stop means sitting down, so stamina comes back too (same rule as the PC eat-in).
  const eff=ev.fx&&ev.fx.hunger?{...ev.fx,stamina:(ev.fx.stamina||0)+Math.round(ev.min*1.2)}:ev.fx;
  if(ev.close&&tod(R.t)>=ev.close){log(`${ev.name}は、もう閉まっていた……。`);fx({spirit:-3});return}
  if(ev.open&&tod(R.t)<ev.open)return menu({title:ev.name,text:`${ev.text}\nまだ開いていない（開店 ${fmt(ev.open)}）。ゴールのクローズまで あと${dur(left)}`,items:[
    {label:`開店まで待つ`,note:`${Math.ceil(ev.open-tod(R.t))}分`,fn:()=>{R.t+=ev.open-tod(R.t);fx({temp:-5});sightEvent({...ev,open:0})}},
    {label:"先を急ぐ",fn:()=>{log(`${ev.name}はまだ開いていなかった。`);trainStop(false,null)}}]});
  const doStop=P.money>=ev.price?()=>{if(ev.soldOut&&Math.random()<ev.soldOut){R.t+=5;fx({spirit:-5});log(`${ev.name}……売り切れだった。`);return}
    if(ev.curse&&Math.random()<ev.curse)R.curseKm=R.km+rnd(20,80);
    R.t+=ev.min;P.money-=ev.price;fx(eff);if(ev.fx&&ev.fx.hunger>=30)R.lastMeal=R.t;SFX.ok();log(`${ev.name}に立ち寄った。${describeFx(eff)}`)}:null;
  menu({title:ev.name,text:`${ev.text}\nゴールのクローズまで あと${dur(left)}`,items:[
    {label:`立ち寄る　<small>${describeFx(eff)}</small>`,note:`${ev.min}分${ev.price?" "+yen(ev.price):""}`,disabled:!doStop,fn:()=>{doStop();trainStop(true)}},
    {label:"先を急ぐ",fn:()=>{log(`${ev.name}はまた今度。`);trainStop(false,doStop)}}]});
}
// ---- Train etiquette: partners ask before speeding up, slowing down or splitting at a stop ----
function leaveTrain(m,msg){R.train=R.train.filter(x=>x!==m);log(`${FRIENDS[m.id].name}${msg}`)}
function trainSplit(m){
  const F=FRIENDS[m.id];
  if(m.extended){if(m.forced){R.pace="normal";updatePaceBtns()}return leaveTrain(m,"「ありがとう！ ここからはマイペースで行きます。ゴールで会いましょう」")}
  const want=F.pace==="fast"?"hard":F.pace==="slow"?"slow":(Math.random()<0.5?"hard":"slow");
  if(want==="hard")return menu({title:`${F.name}「ちょっとペース上げたいんだけど、いい？」`,text:"ついていけば、もうしばらくトレインで走れる。ただし体力と気力をたくさん使う。",items:[
    {label:"ついていく（がんばる）",note:"約20km",disabled:R.spirit<15,desc:R.spirit<15?"気力が足りなくて、ついていけない。":"",fn:()=>{m.until=R.km+rnd(15,25);m.extended=m.forced=true;R.pace="hard";updatePaceBtns();log(`${F.name}の後ろに張りついて、ペースを上げた！`)}},
    {label:"先に行ってください",fn:()=>leaveTrain(m,"「了解！ じゃあ、また後で！」")}]});
  menu({title:`${F.name}「ちょっと脚にきたから、ゆっくり行きたいな」`,text:"合わせれば一緒に走れるが、ペースは落ちる。",items:[
    {label:"合わせる（ゆっくり）",note:"約15km",fn:()=>{m.until=R.km+rnd(10,20);m.extended=m.forced=true;R.pace="slow";updatePaceBtns();P.fp[m.id]=clamp(P.fp[m.id]+3,0,100);log(`${F.name}に合わせてペースを落とした。友情+3`)}},
    {label:"先に行きます",fn:()=>leaveTrain(m,"「気にしないで！ 先に行って」")}]});
}
// The player changes pace: partners who can't or won't match it drop off — confirm first.
function paceConflicts(p){return R.train.filter(m=>!m.cafe&&(p==="hard"?FRIENDS[m.id].pace!=="fast":p==="slow"?FRIENDS[m.id].pace==="fast":false))}
// Someone stops at a sight or a restaurant and the other may not.
function trainStop(stopped,doStop){
  const ms=R.train.filter(m=>!m.cafe);if(!ms.length)return;
  if(stopped){for(const m of ms){if(Math.random()<0.5){P.fp[m.id]=clamp(P.fp[m.id]+2,0,100);log(`${FRIENDS[m.id].name}も一緒に寄った。`)}else leaveTrain(m,"「ぼくは先に行ってます！」")}return}
  const m=ms.find(()=>Math.random()<0.35);if(!m)return;
  menu({title:`${FRIENDS[m.id].name}「ここ、寄っていきたいな」`,text:"一緒に寄るか、ここで別れるか。",items:[
    {label:"一緒に寄る",disabled:!doStop,fn:()=>{doStop();P.fp[m.id]=clamp(P.fp[m.id]+3,0,100);log(`${FRIENDS[m.id].name}と一緒に寄り道。友情+3`)}},
    {label:"先に行く",fn:()=>leaveTrain(m,"「じゃあ、また後で！」")}]});
}
function markTrained(id){P.trained=P.trained||{};P.trained[id]=true}
function joinTrain(id,km){if(R.train.find(m=>m.id===id))return;R.train.push({id,until:R.km+km});markTrained(id);SFX.friend();log(`${FRIENDS[id].name}とトレインを組んだ！`)}
function gainFp(id,n){P.fp[id]=clamp((P.fp[id]||0)+n,0,100);if(n>0)log(`${FRIENDS[id].name}との友情 +${n}`)}
// Things that go wrong before the start, at the start line.
function startTrouble(done){
  const h=(R.present||[]).find(id=>P.fp[id]>=20)||(R.present||[])[0],H=h?FRIENDS[h]:null,T=[];
  T.push(()=>({title:"サイコンが起動しない！",text:"電源ボタンを押しても画面が真っ暗。充電したはずなのに……。",items:[

// At a PC someone may ask to ride on together.
function pcInvite(){
  const c=(R.present||[]).filter(id=>!R.train.some(m=>m.id===id));if(!c.length||R.f.pcInv===R.pc.km||Math.random()>0.3)return false;
  const id=c[Math.floor(Math.random()*c.length)],F=FRIENDS[id];R.f.pcInv=R.pc.km;const nc=nextControl(R.pc.km+0.1);
  SFX.friend();menu({title:`${F.name}「次のPCまで一緒に行きませんか？」`,text:`イートインで隣になった${F.name}に誘われた。${P.fp[id]<10?"\nはじめて話す人だ。":""}`,items:[
    {label:"一緒に行く",fn:()=>{gainFp(id,5);R.train.push({id,until:nc?nc.km:R.pc.km+rnd(30,60)});markTrained(id);log(`${F.name}とトレインを組んだ！`);pcMenu(false)}},
    {label:"今日はソロで",fn:()=>{gainFp(id,1);pcMenu(false)}}]});return true}
function friendEvent(ev){
  const id=ev.fid,F=FRIENDS[id];if(R.train.find(m=>m.id===id))return;
  const after=(n,km)=>{gainFp(id,n);if(n>=12)joinTrain(id,km||rnd(25,60))};
  const items=[];let text="";
  if(F.trouble==="puncture"){
    text=`${F.name}がパンクで止まっている。予備チューブを使い切ったらしい……。`;
    if(R.tubes>0)items.push({label:"チューブを渡して一緒に直す",note:"12分",desc:"自分のチューブが1本減る。",fn:()=>{R.tubes--;R.t+=12;after(30)}});
    if(R.kit)items.push({label:"パッチ当てを手伝う",note:"20分",fn:()=>{R.t+=20;after(22)}});
  }else if(F.trouble==="hunger"){
    text=`${F.name}が道端でうずくまっている。ハンガーノックらしい。`;
    R.pocket.forEach((p,i)=>items.push({label:`${p.name}を分ける`,note:"3分",fn:()=>{R.pocket.splice(i,1);R.t+=3;after(30)}}));
    items.push({label:"次のPCまで一緒に走る",desc:"トレインを組んでゆっくり引っ張る。",fn:()=>{const nc=nextControl();gainFp(id,15);joinTrain(id,nc?nc.km-R.km:20)}});
  }else if(F.trouble==="cold"){
    text=`${F.name}が寒さで震えている。下りで体が冷えたらしい。`;
    if(R.kairo>0)items.push({label:"カイロを渡す",note:"2分",fn:()=>{R.kairo--;R.t+=2;after(30)}});
    if(R.wind&&!R.windOn)items.push({label:"ウインドブレーカーを貸す",desc:"自分はもう着られなくなる。",fn:()=>{R.wind=false;R.t+=2;after(40)}});
    items.push({label:"一緒に走って温まろう",fn:()=>{gainFp(id,12);joinTrain(id,rnd(15,30))}});
  }else if(F.trouble==="light"){
    text=`${F.name}「ライトが点かない！ これじゃ車検に通らないよ……」`;
    items.push({label:"一緒に原因を調べる",note:"4分",fn:()=>{R.t+=4;
      if(P.gear.light_hi||Math.random()<0.5){say("原因がわかった！","スイッチロックがかかっていただけだった！\n長押しで解除。",()=>after(30))}
      else if(R.batteries>0){say("電池切れだった","予備の単4電池を1本あげた。",()=>{R.batteries--;after(30)})}
      else say("わからない……",`${F.name}は予備ライトを探しに行った。`,()=>gainFp(id,10))}});
  }
  items.push({label:"「がんばって！」と声をかけて先へ",fn:()=>gainFp(id,2)});
  SFX.friend();menu({title:`仲間のピンチ：${F.name}`,text,items});
}

/* ================= PC (convenience store) ================= */
function arrivePC(ev){
  const close=closeOf(ev.km);
  G.mode="pc";R.pc=ev;R.pcShelf=null;R.pcArrive=R.t;R.pcLast="";R.pcBought=[];SFX.pc();
  log(`${ev.name} 到着 ${fmt(R.t)}（クローズ目安 ${fmt(close)}）`);
  if(R.t>close){R.pcLast=`クローズ目安 ${fmt(close)} を過ぎてしまった。ゴールの制限時間に注意！`;fx({spirit:-5})}
  if(!pcInvite())pcMenu(false);
}
function pcAct(msg,min){R.pcLast=min?`${msg}（${min}分経過）`:msg;BQA.sfx("coin");pcMenu(true)}
function pcMenu(keep){
  const ev=R.pc,items=[];if(!R.pcShelf)R.pcShelf=pickShelf(ev.chain);const list=R.pcShelf;
  const seated=it=>it.fx?{...it.fx,stamina:(it.fx.stamina||0)+Math.round(it.min*1.2)}:it.fx;
  const buy=it=>{P.money-=it.price;R.receipts[ev.km]=true;R.t+=1+(it.min||0);fx(seated(it));if(it.pocket)R.pocket.push({...it.pocket});if(it.give)R[it.give]++;R.pcBought.push(it.name.replace(/\(持ち出し\)/,""))};
  const sec=t=>items.push({header:true,disabled:true,label:t});
  sec("イートインで座って食べる（体力も回復）");
  for(const it of list.filter(i=>i.fx))items.push({label:`${it.name}　<small>${describeFx(seated(it))}</small>`,note:`${yen(it.price)}・${it.min+1}分`,disabled:P.money<it.price,
    fn:()=>{buy(it);pcAct(`${it.name}を座って食べた！ ${describeFx(seated(it))}`,it.min+1)}});
  sec("ポケットに入れて持っていく");
  for(const it of list.filter(i=>i.pocket)){const full=R.pocket.length>=6;
    items.push({label:`${it.pocket.name}　<small>${full?"ポケットがいっぱい":"走りながら "+describeFx(it.pocket)}</small>`,note:`${yen(it.price)}・1分`,disabled:P.money<it.price||full,
      fn:()=>{buy(it);pcAct(`${it.pocket.name}をポケットに入れた。（${R.pocket.length}/6）走行中に「食べる」で食べられる。`,1)}});}
  sec("備品を買う");
  for(const it of list.filter(i=>i.give)){const n=it.give==="kairo"?"カイロ":"単4電池";
    items.push({label:`${n}　<small>手持ち ${R[it.give]}</small>`,note:`${yen(it.price)}・1分`,disabled:P.money<it.price,fn:()=>{buy(it);pcAct(`${n}を買った。手持ち ${R[it.give]}。`,1)}});}
  sec("そのほか");
  items.push({label:"トイレを借りる　<small>気力+5</small>",note:"3分",fn:()=>{R.t+=3;fx({spirit:5});pcAct("すっきりした。気力+5",3)}});
  items.push({label:"イートインで仮眠　<small>眠気-20 体温は下がらない</small>",note:"15分",fn:()=>{R.t+=15;rest(15);R.sleepy=clamp(R.sleepy-20,Math.min(70,sleepDebt()*1.5),100);fx({spirit:10,stamina:6});pcAct("イートインの隅で15分うとうとした。",15)}});
  items.push({label:"座って休憩　<small>体力+15 体温がちょうどよくなる</small>",note:"10分",fn:()=>{R.t+=10;R.temp+=(50-R.temp)*0.6;fx({stamina:15});pcAct("店内で座って休んだ。体力+15 体温がちょうどよくなってきた",10)}});
  if(R.bank>0)items.push({label:`モバイルバッテリーで充電　<small>${R.lightType==="usb"?"ライト・スマホ満タン":"スマホ満タン"}</small>`,note:`残${R.bank}回`,fn:()=>{R.bank--;R.phone=100;if(R.lightType==="usb")R.light=R.lightMax;pcAct("充電した。")}});
  if(R.wind)items.push({label:R.windOn?"ウインドブレーカーを脱ぐ":"ウインドブレーカーを着る",note:"1分",fn:()=>{R.windOn=!R.windOn;R.t+=1;pcAct(R.windOn?"ウインドブレーカーを着た。":"ウインドブレーカーを脱いだ。",1)}});
  items.push({label:R.receipts[ev.km]?"出発する！":"出発する！　<small>（レシートなし）</small>",fn:leavePC});
  const st=`満腹 ${Math.round(R.hunger)}　体力 ${Math.round(R.stamina)}　気力 ${Math.round(R.spirit)}　体温 ${Math.round(R.temp)}${R.temp<35?"（寒い）":R.temp>65?"（暑い）":""}`;
  menu({title:ev.name,text:`所持金 ${yen(P.money)}　ポケット ${R.pocket.length}/6　レシート ${R.receipts[ev.km]?"あり":"まだ（何か買うともらえる）"}\n${st}${R.pcBought.length?"\n買ったもの："+R.pcBought.join("、"):""}${R.pcLast?`\n<span style="color:var(--gold)">▷ ${R.pcLast}</span>`:""}`,items,keep,
    live:()=>`⏱ 1つ買うごとに1分　現在 ${fmt(R.t)}　滞在 ${Math.round(R.t-R.pcArrive)}分　ゴール制限まで ${dur(R.course.start+R.course.limit-R.t)}`});
}
function describeFx(f){if(!f)return"";const n={hunger:"満腹",spirit:"気力",stamina:"体力",temp:"体温",sleepy:"眠気",weight:"体重"};return Object.entries(f).filter(([k,v])=>v&&n[k]).map(([k,v])=>k==="weight"?`体重+${v}kg`:`${n[k]}${v>0?"+":""}${v}`).join(" ")}
function leavePC(){
  const ev=R.pc;
  const go=()=>{G.mode="ride";log(`${ev.name} 出発 ${fmt(R.t)}`);renderIdle()};
  if(!R.receipts[ev.km])return menu({title:"レシートがない！",text:"何か買わないと通過証明にならない。ゴールで失格になるかも。",items:[{label:"お店に戻る",fn:()=>pcMenu(false)},{label:"それでも出発",fn:go}]});
  go();
}

function eat(i){const p=R.pocket.splice(i,1)[0];fx(p);log(`${p.name}を食べた。`)}
function eatMenu(title){
  if(G.mode!=="ride"||UI.open)return;
  if(!R.pocket.length){log("ポケットに食べ物がない！ 次のPCで買おう。");return}
  menu({title:title||"ポケットの補給食",text:"走りながら食べる。",items:[...R.pocket.map((p,i)=>({label:p.name,note:describeFx(p),fn:()=>eat(i)})),{label:"やめる",fn:()=>{}}],cancel:()=>{}});
}
function pauseMenu(){

  const items=[{label:"走りに戻る",fn:()=>{}}];
  if(R.wind)items.push({label:R.windOn?"ウインドブレーカーを脱ぐ":"ウインドブレーカーを着る",fn:()=>{R.windOn=!R.windOn;log(R.windOn?"ウインドブレーカーを着た。":"ウインドブレーカーを脱いだ。")}});

  if(R.lightType==="aaa"&&R.batteries>0&&R.light<R.lightMax*0.5)items.push({label:"単4電池を交換",fn:()=>{R.batteries--;R.light=R.lightMax;R.t+=2;log("電池を交換した。")}});
  if(R.rainGear)items.push({label:R.rainOn?"レインウェアを脱ぐ":"レインウェアを着る",fn:()=>{R.rainOn=!R.rainOn;R.t+=2;log(R.rainOn?"レインウェアを着た。":"レインウェアを脱いだ。")}});
  items.push({label:"道端で仮眠する",note:"15分",desc:"眠気・気力・体力が回復するが、体が冷える。",fn:()=>nap(15,"15分だけ目を閉じた。少し楽になった。")});

  items.push({label:"音の設定",desc:"音楽と効果音のオン・オフと音量。",fn:()=>soundMenu(pauseMenu)});

function refTime(){

    fn:()=>done(fr?"コントロールで仮眠してから、来た道をのんびり戻った。":back>150?`${back}km、休み休み走って帰った。長かった……。`:"のんびり自走で帰った。",{fat:Math.round(back/6),sick:night?0.25:0.1})});

function endRun(title,text,o={}){
  P.km+=Math.round(R?R.km:0);
  let fixes="";
  if(R&&R.broken){const L=[];
    for(const id in R.broken){
      if(PARTS[id]){const cur=PARTS[id].opts.find(o=>o.id===P.parts[id]);const cost=id==="tire"?(cur.price||6000):id==="wheel"?8000:12000;
        P.money-=cost;L.push(`${cur.name}を${id==="tire"?"買い直した":"修理した"}（${yen(cost)}）`)}
      else{L.push(`${wearName(id)}は捨てるしかない。ショップで買い直そう`);delete P.gear[id]}}
    fixes="\n\n【壊れたもの】\n"+L.join("\n")}
  if(R&&R.km>20){const b=R.km/1000;P.body=clamp(P.body-b,55,95)}
  P.fatigue=clamp((P.fatigue||0)+(o.fatigue||0),0,100);
  let extra="";
  if(R)P.rodeWeek=P.week;
  // cold or wet for too long: a cold, and next week off the bike
  if(R&&!P.test){const risk=clamp((R.coldMin||0)/500+(R.wetMin||0)/300+(R.hypoMin>=30?0.5:0),0,0.7);
    if(risk>0.05&&Math.random()<risk){P.sickWeek=P.week+1;extra+=`\n帰ってから熱が出た。${R.wetMin>60?"雨に濡れたまま走ったのがいけなかった。":"体を冷やしすぎた。"}風邪をひいたらしい。来週は自転車に乗れない。`}}
  // riding keeps the legs: a brevet, a cafe ride or an event (hill climbs, ice brevets…) counts like a training week
  if(R)P.lastTrain=P.week;
  if(o.grow&&R&&R.lo){const n=Math.max(2,Math.round(3*o.grow/200)),lo=R.lo;
    const k=[["sta",1-lo.sta],["spi",1-lo.spi],["slp",lo.slp]].sort((a,b)=>b[1]-a[1])[0][0];
    if(k==="sta"){P.staMax=Math.min(160,P.staMax+n);extra+=`\n体力を使い切りかけた経験で、体力の上限が+${n}（${P.staMax}）。`}
    else if(k==="spi"){P.spiMax=Math.min(160,(P.spiMax||100)+n);extra+=`\n心が折れかけても走り切った。気力の上限が+${n}（${P.spiMax}）。`}
    else{P.sleepMax=Math.min(160,(P.sleepMax||100)+n);extra+=`\n眠気と戦い抜いた。眠気に強くなった（眠気耐性 ${P.sleepMax}）。`}}
  save();
  const items=[{label:"家に帰る",fn:()=>{R=null;nextWeek()}}];
  // Back-to-back brevets (e.g. 後志300 → ウニタラコ200, 岩木山200 → 北へ600): go straight on to the next start.
  if(R&&R.course.kind==="brm"&&R.course.ymd&&!P.test){const cur=R.course,fin=Math.floor(R.t/1440);
    for(const n of weekItems(P.week).filter(c=>c.kind==="brm"&&c.id!==cur.id&&(ymdDate(c.ymd)-ymdDate(cur.ymd))/864e5>fin&&!(P.rec[c.id]&&P.rec[c.id].week===P.week))){
      const cost=feeOf(n)+(n.region===cur.region?0:9000);
      items.unshift({label:`続けて「${n.name.replace(/^BRM\d+ /,"")}」に出る`,note:`${jpDate(n.ymd).replace(/^\d+月/,"")} ${yen(cost)}`,disabled:P.money<cost,
        desc:`家に帰らず、そのまま次のスタートへ。疲労 ${Math.round(P.fatigue)} を抱えたまま走る。${n.region===cur.region?"":"移動費込み。"}`,fn:()=>{R=null;enter(n,cost)}})}}
  if(R&&P.rec[R.course.id])P.rec[R.course.id].week=P.week;
  menu({title,text:text+extra+`\n疲労 ${Math.round(P.fatigue)}`+fixes,items});
}

function trainFx(it){
  const d=it.dist,ratio=(it.gain||0)/d/10,f={leg:0,climb:0,staMax:0,body:0};
  f.leg=0;
  if(ratio>0.6)f.climb=ratio>1?0.02:0.01;
  if(it.kind==="gravel")f.climb+=0.01;
  if(d>=120)f.staMax=4;else if(d>=80)f.staMax=2;
  f.body=-d/250;
  const sp=TRAIN_SPECIAL[it.id]||{};for(const k of ["leg","climb","staMax","body"])f[k]+=sp[k]||0;
  return f;
}
function trainText(f){const t=[];

function packing(C,keep){

      fn:()=>{let v=(n+1)%(it.max+1);p[it.id]=v;if(packWeight(p)>cap+1e-9){p[it.id]=0;BQA.sfx("no")}packing(C,true)}}});

      fn:()=>{P.lodgePick=P.lodgePick+1>=C.lodges.length?-1:P.lodgePick+1;packing(C,true)}})}
  else P.lodgePick=-1;

}

function drawRider(x,gy,jersey,frame,crank,night,pose,helmet="#fcfcfc",vest=false,small=false){
  const wy=gy-8,fx=x+23,wr=small?5:8,wo=small?3:0,bb={x:x+11,y:wy+1},seat={x:x+8,y:wy-11},head={x:x+20,y:wy-10};
  for(const cx of [x,fx]){const y=wy+wo,sp=wr-3;ring(cx,y,wr,"#000");ring(cx,y,wr-1,"#3c3c3c");ring(cx,y,wr-2,night?"#7c7c7c":"#bcbcbc");
    const a=crank*1.7+cx;line(cx-Math.cos(a)*sp,y-Math.sin(a)*sp,cx+Math.cos(a)*sp,y+Math.sin(a)*sp,"#bcbcbc");line(cx-Math.sin(a)*sp,y+Math.cos(a)*sp,cx+Math.sin(a)*sp,y-Math.cos(a)*sp,"#bcbcbc")}
  const hip={x:x+8,y:wy-15},P2={up:[17,-23,21,-27],climb:[16,-24,20,-28],dh:[19,-19,24,-21],dance:[18,-25,22,-29]}[pose||"up"],sh={x:x+P2[0],y:wy+P2[1]},hd={x:x+P2[2],y:wy+P2[3]};
  // far leg
  const leg=(a,c)=>{const pd={x:bb.x+Math.cos(a)*4,y:bb.y+Math.sin(a)*4};const dx=pd.x-hip.x,dy=pd.y-hip.y,d=Math.min(17.5,Math.hypot(dx,dy));
    const base=Math.atan2(dy,dx),k=Math.acos(clamp((81+d*d-81)/(2*9*d),-1,1));const kn={x:hip.x+Math.cos(base-k)*9,y:hip.y+Math.sin(base-k)*9};
    line(hip.x,hip.y,kn.x,kn.y,c,2);line(kn.x,kn.y,pd.x,pd.y,c,2);rect(pd.x-2,pd.y,4,1,"#000")};
  leg(crank+Math.PI,"#1c1c1c");
  line(x,wy,bb.x,bb.y,frame,2);line(x,wy,seat.x,seat.y,frame);line(seat.x,seat.y,bb.x,bb.y,frame,2);line(seat.x,seat.y,head.x,head.y,frame,2);line(bb.x,bb.y,head.x,head.y,frame,2);line(head.x,head.y,fx,wy,frame,2);
  rect(seat.x-3,seat.y-2,7,2,"#000");line(head.x,head.y,head.x+3,head.y-3,"#7c7c7c");rect(head.x+3,head.y-3,2,4,"#000");
  line(hip.x,hip.y,sh.x,sh.y,jersey,3);
  if(vest){line(hip.x,hip.y-1,sh.x-1,sh.y+1,"#b8f818",3);line(hip.x+2,hip.y-5,sh.x-1,sh.y+4,night?"#fcfcfc":"#bcbcbc",1)}
  if(pose==="dh"){rect(head.x+1,head.y-5,7,1,"#000");line(sh.x,sh.y,head.x+5,head.y-6,jersey,2)}else line(sh.x,sh.y,head.x+4,head.y-2,jersey,2);
  if(pose==="dance"&&Math.floor(performance.now()/200)%3===0)rect(hd.x-6,hd.y-2,1,2,"#3cbcfc");
  rect(hd.x-3,hd.y-1,6,5,"#f0d0b0");rect(hd.x-4,hd.y-3,8,3,helmet);rect(hd.x-4,hd.y-3,8,1,helmet==="#fcfcfc"?jersey:"#fcfcfc");if(P&&P.gear&&P.gear.helmet_light&&night)rect(hd.x+3,hd.y-4,2,1,"#f8d878");rect(hd.x+1,hd.y+1,3,1,"#000");
  leg(crank,"#000");
  if(night&&Math.floor(performance.now()/300)%2)rect(seat.x-4,seat.y+1,2,2,"#f83800");
}
// Rain streaks lean with the wind; wind streaks fly past faster in a headwind.
function drawWeather(dt){
  const hw=windNow(),v=G.mode==="ride"&&!UI.open?speed():0;
  G.wx=(G.wx||0)+((v/3.6)+hw)*dt*14;
  if(raining()){const lean=clamp(hw,-6,6);for(let i=0;i<70;i++){const x=((hash(i)*W*1.3-G.wx*0.6+performance.now()/9*(i%3+1))%W+W)%W,y=(hash(i+50)*H+performance.now()/4*(1+i%2))%H;line(x,y,x+2+lean*0.4,y+6,"#a4e4fc")}}
  if(Math.abs(hw)>1.5){const n=Math.min(10,Math.round(Math.abs(hw)*1.5));for(let i=0;i<n;i++){const x=((hash(i+200)*W-G.wx)%W+W)%W,y=20+hash(i+300)*90;rect(x,y,hw>0?8:5,1,"#fcfcfc")}}
}
function drawMini(){
  const C=R.course,x0=168,y0=4,w=84,h=22;rect(x0-1,y0-1,w+2,h+2,"#fcfcfc");rect(x0,y0,w,h,"#000");
  const maxE=Math.max(...C.profile.map(p=>p[1]),200);
  for(let i=0;i<w;i++){const km=C.dist*i/w;let e=0;const pp=C.profile;for(let j=1;j<pp.length;j++)if(km<=pp[j][0]){e=pp[j-1][1]+(pp[j][1]-pp[j-1][1])*(km-pp[j-1][0])/(pp[j][0]-pp[j-1][0]);break}
    const hh=Math.max(1,Math.round(e/maxE*(h-4)));rect(x0+i,y0+h-hh,1,hh,"#00a800")}
  for(const e of C.events)if(e.type==="pc")rect(x0+Math.round(e.km/C.dist*w),y0,1,h,"#f8b800");
  if(Math.floor(performance.now()/250)%2)rect(x0+Math.round(R.km/C.dist*w)-1,y0+1,3,3,"#f83800");
}
function drawLogo(){
  ctx.font='16px "DotGothic16",monospace';ctx.textAlign="center";
  ctx.fillStyle="#000";ctx.fillText("BREVET QUEST",W/2+2,36);ctx.fillStyle="#f8b800";ctx.fillText("BREVET QUEST",W/2,34);
  ctx.font='12px "DotGothic16",monospace';ctx.fillStyle="#000";ctx.fillText("ブルベクエスト 北海道",W/2+1,53);ctx.fillStyle="#fcfcfc";ctx.fillText("ブルベクエスト 北海道",W/2,52);
}
function draw(dt){
  const riding=G.mode==="ride"&&!UI.open&&R;
  const inRun=R&&["ride","pc","pre"].includes(G.mode);
  const t=inRun?R.t:G.bg.tod,scen=inRun?scenAt(R.km):G.bg.scen;
  const v=riding?speed():(inRun?0:G.bg.speed);
  const k=riding?G.ff:1;
  G.scroll+=v*2.4*dt*k;G.crank+=v*0.35*dt*k;
  const p=palette(t);
  drawSky(p,t);drawFar(scen,p);drawMid(scen,p);
  if(inRun){const KM=600;for(const e of R.events){const dx=(e.km-R.km)*KM;if(dx<-90||dx>W)continue;const x=96+dx;
      if(e.type==="pc")drawStore(x-10,e.chain,p);else if(e.type==="goal")drawGoal(x-6);else if(e.type==="check")drawSign(x,"#0058f8");else if(e.type==="sight")drawSign(x+20,"#f83800")}}
  drawRoad(p);
  const night=inRun?isNight(R.t):p.night;
  if(inRun&&night&&R.light>0){ctx.fillStyle="rgba(252,224,168,0.35)";ctx.beginPath();ctx.moveTo(122,119);ctx.lineTo(W,116);ctx.lineTo(W,145);ctx.lineTo(160,145);ctx.fill()}
  if(inRun&&R.deer)drawDeer(190);
  if(inRun)R.train.forEach((m,i)=>drawRider(66-i*28,138,FRIENDS[m.id].color,"#7c7c7c",G.crank+i*1.3,night,"up","#fcfcfc",R.course.kind==="brm"));
  const pose=!inRun?"up":dhOn()?"dh":(R.pace==="hard"&&gradeAt(R.km)>1.5)?"dance":gradeAt(R.km)>3?"climb":"up";
  const LK=P?looks():{jersey:"#f8b800",helmet:"#fcfcfc"};
  drawRider(100,138,LK.jersey,P&&P.bike?frameColor():"#0058f8",G.crank,night,pose,LK.helmet,inRun&&R.course.kind==="brm",P&&P.bike==="brompton");
  if(inRun)drawWeather(dt*k);
  if(inRun)drawMini();
  if(G.mode==="title")drawLogo();
}

/* ================= MAIN LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(G.mode==="ride"&&!UI.open&&R)rideTick(dt);
  draw(dt);updateHUD(dt);
  BQA.scene(bgmFor());
  requestAnimationFrame(frame);
}
(document.fonts&&document.fonts.load?document.fonts.load('16px "DotGothic16"').catch(()=>{}):Promise.resolve()).finally(()=>{});
title();requestAnimationFrame(frame);
</script>
