<style>
/* Layout: one Famicom screen stacked over a status panel and a DQ-style message window. Deliberately single-theme (black CRT). */
:root{
  --bg:#000000; --fg:#fcfcfc; --dim:#bcbcbc; --mute:#7c7c7c;
  --red:#f83800; --gold:#f8b800; --sky:#3cbcfc; --green:#58d854; --pink:#f878f8; --blue:#6888fc;
  --pixel:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--pixel);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{max-width:560px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:10px}
#screen{position:relative;width:100%;aspect-ratio:256/160;max-width:100%;border:3px solid var(--fg);border-radius:4px;overflow:hidden;background:#000}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#gauges{position:absolute;left:1.5%;top:2%;width:31%;background:rgba(0,0,0,.6);border-radius:3px;padding:3px 5px;display:flex;flex-direction:column;gap:1px;font-size:clamp(8px,2.4vw,11px);line-height:1.15}
#gauges .g{display:flex;align-items:center;gap:4px;min-width:0}
#gauges span{flex:0 0 3.1em;color:var(--fg);white-space:nowrap}
#gauges i{flex:1;height:5px;border:1px solid var(--fg);position:relative;display:block;min-width:0;background:#000}
#gauges b{position:absolute;inset:0 auto 0 0;display:block}
#gauges .low span{color:var(--red);animation:blink .6s steps(1) infinite}
.box{border:3px solid var(--fg);border-radius:8px;padding:10px 12px;background:var(--bg);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--mute)}
#hud{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;padding-block:6px}
#hud .row{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between}
#hud .big{font-size:17px}
#hud .small{font-size:13px;color:var(--dim)}
#hud .warn{color:var(--red)}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px}
.bar{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.bar label{flex:0 0 auto;width:3.2em;color:var(--dim)}
.bar i{flex:1;height:8px;border:1px solid var(--fg);display:block;position:relative;min-width:0}
.bar b{position:absolute;inset:0 auto 0 0;display:block;width:50%}
#win{min-height:120px;display:flex;flex-direction:column;gap:6px}
.w-title{color:var(--gold);font-size:16px;text-wrap:balance}
.w-text{white-space:pre-line}
.w-live{color:var(--sky);font-variant-numeric:tabular-nums}
.w-list{display:flex;flex-direction:column;gap:2px}
.opt{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:3px 4px 3px 22px;position:relative;border-radius:3px}
.opt .note{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.opt.sel::before{content:"▶";position:absolute;left:4px;animation:blink 0.8s steps(1) infinite}
.opt.sel{background:#1c1c3c}
.opt:focus-visible{outline:2px solid var(--gold)}
.opt[disabled]{color:var(--mute);cursor:default}
.opt small{font-size:12px;color:var(--green)}
.opt[disabled] small{color:var(--mute)}
.w-sec{font-size:12px;color:var(--gold);letter-spacing:0.05em;padding:6px 4px 0;border-bottom:1px dashed var(--mute)}
.w-desc{color:var(--dim);font-size:13px;border-top:1px dashed var(--mute);padding-top:5px;min-height:1.5em}
.log p{margin:0}
.log p:last-child{color:var(--fg)}
.log p:not(:last-child){color:var(--mute)}
#ctrl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
#ctrl button{all:unset;cursor:pointer;border:2px solid var(--fg);border-radius:4px;padding:6px 0;font-size:clamp(10px,3vw,13px);letter-spacing:-.04em;text-align:center;white-space:nowrap;overflow:hidden;min-width:0}
#ctrl button.on{background:var(--fg);color:var(--bg)}
#ctrl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.help{font-size:12px;color:var(--mute)}
a{color:var(--sky)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.opt.sel::before{animation:none}}
@media (max-width:420px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}body{font-size:14px}}
</style>

</head>

    <div id="gauges" hidden>
      <div class="g"><span>体力</span><i><b id="g-sta" style="background:var(--green)"></b></i></div>
      <div class="g"><span>満腹</span><i><b id="g-hun" style="background:var(--gold)"></b></i></div>
      <div class="g"><span>気力</span><i><b id="g-spi" style="background:var(--pink)"></b></i></div>

      <div class="g"><span>ライト</span><i><b id="g-lit" style="background:#fce0a8"></b></i></div>
      <div class="g"><span>スマホ</span><i><b id="g-pho" style="background:var(--blue)"></b></i></div>
    </div></div>
  <div id="ctrl" hidden>
    <button id="c-slow" data-pace="slow">ゆっくり</button>
    <button id="c-norm" data-pace="normal">ふつう</button>
    <button id="c-hard" data-pace="hard">がんばる</button>
    <button id="c-eat">食べる</button>
    <button id="c-ff">×1</button>
    <button id="c-menu">メニュー</button>
  </div>
  <div id="hud" class="box" hidden>
    <div class="row big"><span id="h-time"></span><span id="h-dist"></span><span id="h-spd"></span></div>
    <div class="row small" id="h-next"></div>
    <div class="row small" id="h-wx"></div>
    <div class="row small" id="h-inv"></div>
  </div>
  <div id="win" class="box"></div>
  <div class="help">操作：↑↓で選ぶ、Z / Enter で決定、X / Esc で戻る。走行中は 1・2・3 でペース、E で食べる、F で早送り。コースは作者のブログ記録をもとにした概略です（標高・一部地点は推定）。</div>
</div>

      {label:"コンビニ補給で済ませて先へ",fn:()=>log(`${label}はパス。先を急ぐ。`)}]});

}

// Weeks of the season run Tuesday → Monday, so a Monday holiday (5/4, 7/20, 9/21) stays with its weekend.
const WEEKS=(()=>{const w=[];for(let d=new Date(2026,2,31);d<=new Date(2026,9,27);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7))w.push(d);return w})();
function ymdOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function weekItems(i){const a=WEEKS[i],b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6),A=ymdOf(a),B=ymdOf(b);
  return [...COURSES.filter(c=>c.ymd&&!c.memory&&c.ymd>=A&&c.ymd<=B),...EVENTS.filter(e=>e.ymd>=A&&e.ymd<=B)].sort((x,y)=>x.ymd<y.ymd?-1:1)}
function weekLabel(i){const a=WEEKS[i],s=new Date(a.getFullYear(),a.getMonth(),a.getDate()+4),u=new Date(a.getFullYear(),a.getMonth(),a.getDate()+5);
  const hol=weekItems(i).some(e=>ymdDate(e.ymd).getDay()===1)?`・${new Date(a.getFullYear(),a.getMonth(),a.getDate()+6).getDate()}(月祝)`:"";
  return `${s.getMonth()+1}/${s.getDate()}(土)・${u.getMonth()+1}/${u.getDate()}(日)${hol}`}
function weekMonth(i){const a=WEEKS[i];return new Date(a.getFullYear(),a.getMonth(),a.getDate()+4).getMonth()+1}

function beep(f=880,d=0.05,type="square",vol=0.04,when=0){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}
}

function bikeOf(){return BIKES[P.bike]}
function looks(){return Object.assign({jersey:"#f8b800",helmet:"#fcfcfc",frames:{}},P.looks||{})}
function frameColor(){const L=looks();return L.frames[P.bike]||bikeOf().color}
function partStat(){const s={w:0,aero:1,climb:1,comfort:1,punct:1,sealant:false};
  for(const sl in PARTS){const o=PARTS[sl].opts.find(x=>x.id===P.parts[sl]);if(!o)continue;s.w+=o.w||0;s.aero*=o.aero||1;s.climb*=o.climb||1;s.comfort*=o.comfort||1;s.punct*=o.punct||1;if(o.sealant)s.sealant=true}
  return s}
function bikeWeight(){return bikeOf().weight+partStat().w}
function bestLight(){let b=null;for(const g of GEAR)if(g.light&&P.gear[g.id]&&(!b||g.light.hours>b.light.hours))b=g;return b}
// BRM/AJ rules: bell, helmet, front light, steady rear light and reflective wear for every distance;
// 400km and up also needs two front lights fixed to the bike and a rear light on the helmet.
function frontLights(){return GEAR.filter(g=>g.light&&P.gear[g.id]).sort((a,b)=>b.light.hours-a.light.hours)}
function missingGear(kind,cls){
  const m=[];if(!P.gear.helmet)m.push("ヘルメット");
  if(kind!=="brm")return m;
  if(!P.gear.bell)m.push("ベル");

  if(!(P.gear.rear||P.gear.radar))m.push("尾灯");

  return m}
function hasRequired(){return !missingGear("brm",200).length}
function packCap(){return P.gear.bag?5:2}
function packWeight(p){return PACK.reduce((s,it)=>s+(p[it.id]||0)*it.w,0)}
function packCost(p){return PACK.reduce((s,it)=>s+(p[it.id]||0)*(it.cost||0),0)}
function lodgeCost(C){return C.lodges&&P.lodgePick>=0&&C.lodges[P.lodgePick]?C.lodges[P.lodgePick].price:0}

/* ================= COURSE MATH ================= */
function elevAt(km){const p=R.course.profile;if(km<=p[0][0])return p[0][1];
  for(let i=1;i<p.length;i++)if(km<=p[i][0]){const a=p[i-1],b=p[i];return a[1]+(b[1]-a[1])*(km-a[0])/(b[0]-a[0])}
  return p[p.length-1][1]}
// Hokkaido roads roll: small undulations on top of the coarse profile.
function rollAt(km){return 9*Math.sin(km*0.9)+5*Math.sin(km*2.3+1)}
function gradeAt(km){return clamp((elevAt(km+0.25)+rollAt(km+0.25)-elevAt(km-0.25)-rollAt(km-0.25))/500*100,-10,10)}
function headingAt(km){let h=0;for(const [k,d] of R.course.heading||[[0,0]])if(km>=k)h=d;return h}
// Headwind component in m/s (negative = tailwind). Wind picks up in the afternoon.
function windNow(){const d=tod(R.t)/60,s=R.windDay.spd*(0.75+0.45*Math.max(0,Math.sin(Math.PI*(d-7)/12)));
  let hw=s*Math.cos((R.windDay.dir-headingAt(R.km))*Math.PI/180);const gz=zone(R.course.gust||[],R.km);if(gz)hw+=gz[2];return hw}
function raining(){return !!zone(R.rainZones||[],R.km)}
function dhOn(){return P.parts.dh==="dh"&&!R.train.length&&Math.abs(gradeAt(R.km))<2.5}
const COMPASS=["北","北東","東","南東","南","南西","西","北西"];
function compass(d){return COMPASS[Math.round(((d%360)+360)%360/45)%8]}
function scenAt(km){let s=R.course.scenery[0][1];for(const [k,t] of R.course.scenery)if(km>=k)s=t;return s}
function zone(list,km){for(const z of list)if(km>=z[0]&&km<z[1])return z;return null}
function tod(t){return ((t%1440)+1440)%1440}
function isNight(t){const d=tod(t),C=R.course;return d<C.sunrise||d>=C.sunset}
function ambient(t,km){const C=R.course,d=tod(t)/60;const k=Math.max(0,Math.sin(Math.PI*(d-5)/14));return C.tNight+(C.tDay-C.tNight)*k-elevAt(km)*0.006}
function closeOf(km){const C=R.course;if(km>=C.dist-0.01)return C.start+C.limit;const h=km<=60?km/20+1:km/15;return C.start+Math.round(h*60)}
function controls(){return R.course.events.filter(e=>e.type==="pc"||e.type==="check")}
function nextControl(){return R.course.events.find(e=>(e.type==="pc"||e.type==="goal")&&e.km>R.km+0.001)}

function speed(){
  const B=bikeOf(),S=partStat(),g=gradeAt(R.km),m=P.body+bikeWeight()+R.load,dh=dhOn();
  let v=P.leg*B.aero*S.aero*(1-R.load*0.012)*(dh?1.06:1);
  // heavier riders suffer more on climbs, but punch through headwind a little better
  if(g>0)v=v/(1+g*0.2*Math.pow(m/80,1.5)*B.climb*S.climb*(1-P.climb));
  else if(g<0)v=Math.min(v*(1+(-g)*0.2)*B.descent,45);
  const hw=windNow();
  if(hw>0)v/=1+hw*0.05*Math.sqrt(80/m)*(dh?0.7:1)*(R.train.length?0.6:1);
  else v*=1-hw*0.025;
  if(R.course.offroad)v*=B.off||0.68;
  v*={slow:0.85,normal:1,hard:1.2}[R.pace];
  if(R.stamina<10)v*=0.6;else if(R.stamina<30)v*=0.85;
  if(R.sleepy>=85)v*=0.7;else if(R.sleepy>=65)v*=0.85;
  if(raining())v*=0.96;
  if(R.hunger<=0)v*=0.45;
  if(R.temp<40)v*=0.85;
  if(R.spirit>=80)v*=1.03;else if(R.spirit<15)v*=0.8;else if(R.spirit<30)v*=0.9;else if(R.spirit<50)v*=0.95;
  if(isNight(R.t)){v*=R.light>0?R.lightNight:1;if(R.light<=0)v=Math.min(v,P.gear.helmet_light?15:10)}
  v*=1+0.06*R.train.length;
  return Math.max(3,v);
}

/* ================= RIDE LOOP ================= */
function log(t){R.log.push(t);if(R.log.length>30)R.log.shift();if(!UI.open)renderIdle()}
function fx(o){if(!o)return;
  if(o.hunger)R.hunger=clamp(R.hunger+o.hunger,0,100);
  if(o.spirit)R.spirit=clamp(R.spirit+o.spirit,0,100);
  if(o.stamina)R.stamina=clamp(R.stamina+o.stamina,0,R.staMax);
  if(o.temp)R.temp=clamp(R.temp+o.temp,0,100);
  if(o.sleepy)R.sleepy=clamp(R.sleepy+o.sleepy,0,100);
  if(o.weight)P.body=clamp(P.body+o.weight,55,95);
}
function rideTick(dt){
  let left=dt*RATE*G.ff;
  while(left>0&&G.mode==="ride"&&!UI.open){const dm=Math.min(0.25,left);left-=dm;simStep(dm)}
}
function simStep(dm){
  const v=speed(),dk=v*dm/60,g=gradeAt(R.km),night=isNight(R.t);
  const ev=R.events[R.evIdx];
  if(ev&&R.km+dk>=ev.km){
    const frac=(ev.km-R.km)/dk;R.km=ev.km;R.t+=dm*frac;drain(dm*frac,g,night);R.evIdx++;trigger(ev);return;
  }
  R.km+=dk;R.t+=dm;drain(dm,g,night);
  // train members leave
  for(const m of R.train.slice())if(R.km>=m.until){R.train=R.train.filter(x=>x!==m);log(`${FRIENDS[m.id].name}「先に行きますね！ ゴールで会いましょう」`)}
  if(randomTrouble(dk,night))return;
  checkStates(night);
}
function drain(dm,g,night){
  const h=dm/60,B=bikeOf();
  const tr=R.train.length?1:0;
  const hw=windNow(),rain=raining(),amb=ambient(R.t,R.km);
  const base={slow:0,normal:9,hard:26}[R.pace],climb={slow:3,normal:5,hard:9}[R.pace];
  const heat=Math.max(0,amb+Math.max(0,g)-26);
  R.stamina=clamp(R.stamina-h*(base+Math.max(0,g)*climb+Math.max(0,hw)*(R.pace==="hard"?1.5:0.5)+heat*1.0)*(tr?0.85:1)*(100/R.staMax),0,R.staMax);
  R.hunger=clamp(R.hunger-h*(({slow:7,normal:11,hard:16}[R.pace])+Math.max(0,g)*1.0),0,100);
  let sp=(night?12:7)*B.comfort*partStat().comfort*(P.gear.jersey?0.85:1);
  const d=tod(R.t)/60;
  const nightUp=22*(R.train.length?0.6:1)*(R.spirit<30?1.2:1);
  R.sleepy=clamp(R.sleepy+h*(d>=22||d<5?nightUp:d<10?-3:2.5),0,100);
  if(R.sleepy>=50)sp+=R.sleepy>=80?12:5;
  if(rain)sp+=R.rainOn?1:5;
  if(R.pace==="hard")sp+=25;
  if(hw>4)sp+=4;
  if(g>3)sp+=(g-3)*2.5;
  sp+=heat;
  if(night&&P.gear.radar)sp*=0.7;
  if(tr)sp*=0.5;
  if(R.temp<50)sp+=6;
  if(R.hunger<15)sp+=5;
  const rz=zone(R.course.rough,R.km);if(rz&&!P.gear.bib)sp+=rz[3]==="butt"?10:4;
  R.spirit=clamp(R.spirit-h*sp,0,100);
  let eff=amb+Math.max(0,g)*1.0+(R.pace==="hard"?2:0)-(g<-2?5:0)-Math.max(0,hw)*0.5-(rain?(R.rainOn?1:5):0);
  eff+=(P.gear.winter?4:0)+(R.windOn?6:0);
  const cold=12-eff;
  R.temp=cold>0?clamp(R.temp-cold*0.03*dm,0,100):clamp(R.temp+0.3*dm,0,100);
  if(night&&R.light>0)R.light=Math.max(0,R.light-h);
  R.phone=Math.max(0,R.phone-h*6);
  R.cool=Math.max(0,R.cool-(speed()*h));
}
function randomTrouble(dk,night){
  if(R.repunct&&R.km>=R.repunct){R.repunct=null;R.cool=6;say("またパンク！","やっぱりガラス片が残っていた……。",troublePuncture);return true}
  if(R.cool>0)return false;
  const rz=zone(R.course.rough,R.km),rough=rz?rz[2]:1;
  const pRate=0.0007*bikeOf().punct*partStat().punct*rough*(raining()?1.5:1);
  const lostRate=P.gear.navi?0.0006:(R.phone>0?0.0015:0.012);
  const deerRate=night&&zone(R.course.deer,R.km)?0.03:0;
  const r=Math.random();
  let acc=pRate*dk;if(r<acc){R.cool=6;troublePuncture();return true}
  acc+=0.0004*dk;if(r<acc){R.cool=6;troubleChain();return true}
  acc+=lostRate*dk;if(r<acc){R.cool=6;troubleLost();return true}
  acc+=deerRate*dk;if(r<acc){R.cool=4;troubleDeer();return true}
  return false;
}
function checkStates(night){
  const f=R.f;
  if(night&&!f.night){f.night=true;log("日が暮れた。ライト点灯。")}
  if(!night&&f.night&&!f.dawn){f.dawn=true;log("空が白んできた。朝だ！");fx({spirit:15})}
  if(R.hunger>40){f.hungry=false;f.bonk=false}
  if(R.hunger<25&&!f.hungry){f.hungry=true;log("おなかが減ってきた……。「食べる」かPCで補給しよう。");if(R.pocket.length){eatMenu("おなかが減ってきた");return}}
  if(R.hunger<=0&&!f.bonk){f.bonk=true;return troubleBonk()}
  if(R.light>0)f.lightout=false;
  if(night&&R.light<=0&&R.backup){const b=R.backup.light;R.backup=null;Object.assign(R,{light:b.hours,lightMax:b.hours,lightType:b.type,lightNight:Math.min(1,b.night+(P.gear.helmet_light?0.03:0))});log("前照灯が切れた。2灯目に切り替えた。");return}
  if(night&&R.light<=0&&!f.lightout){f.lightout=true;return troubleLight()}
  if(R.phone<=0&&!f.phone){f.phone=true;if(R.bank>0)return menu({title:"スマホの電池切れ",text:"Ride on QCが見られない！ ナビなしだと道に迷いやすい。",items:[{label:"モバイルバッテリーで充電",note:`残${R.bank}回`,fn:()=>{R.bank--;R.phone=100;f.phone=false;log("スマホを充電した。")}},{label:"このまま走る",fn:()=>log("キューシート頼みで走る。")}]});log("スマホの電池が切れた。キューシート頼みだ……。")}
  const rn=raining();
  if(rn&&!f.rain){f.rain=true;fx({spirit:-8});if(R.rainGear&&!R.rainOn)return menu({title:"雨が降ってきた！",text:"本降りになりそうだ。レインウェアを着る？\n着ないと靴まで水没して、体がどんどん冷える。",items:[{label:"着る",note:"2分",fn:()=>{R.rainOn=true;R.t+=2;log("レインウェアを着た。")}},{label:"このまま走る",fn:()=>log("雨具なしで突っ込む……。")}]});log("雨が降ってきた！ レインウェアがない……。")}
  if(!rn&&f.rain){f.rain=false;log("雨が上がった。")}
  if(R.stamina>50)f.tired=false;
  if(R.stamina<30&&!f.tired){f.tired=true;log("脚がへばってきた……。「ゆっくり」にすると回復する。")}
  if(R.sleepy<45)f.sleepy=false;
  if(R.sleepy>=60&&!f.sleepy){f.sleepy=true;log("眠い……。速度と気力が落ちてきた。メニューから仮眠できる。")}
  if(R.sleepy>=99)return forcedCrash();
  if(R.sleepy>=80&&Math.random()<(R.sleepy-75)*0.004)return troubleDoze();
  if(R.temp>70)f.coldAsk=false;
  if(R.temp<60&&R.wind&&!R.windOn&&!f.coldAsk){f.coldAsk=true;return menu({title:"寒い！",text:"体が冷えてきた。ウインドブレーカーを着る？",items:[{label:"着る",note:"1分",fn:()=>{R.windOn=true;R.t+=1;log("ウインドブレーカーを着た。")}},{label:"まだ我慢する",fn:()=>{}}]})}
  if(R.temp>45)f.freeze=false;
  if(R.temp<35&&!f.freeze){f.freeze=true;return troubleCold()}
  if(R.pace==="hard"&&R.spirit<10){R.pace="normal";updatePaceBtns();log("気力が尽きた。もうがんばれない……。ペースを「ふつう」に落とした。")}
  if(R.spirit<15!==!!f.lowSpi){f.lowSpi=R.spirit<15;updatePaceBtns()}
  if(R.stamina<=0)return troubleExhaust();
  if(mealCheck())return;
  if(R.spirit<=0)return troubleSpirit();
}

}

/* ================= EVENTS ================= */
function trigger(ev){
  if(ev.type==="note"){log(ev.text);if(ev.spirit)fx({spirit:ev.spirit});return}
  if(ev.type==="pc")return arrivePC(ev);
  if(ev.type==="check"){SFX.ok();return say(ev.name,"ブルベカードに通過を記録した。(2分)",()=>{R.t+=2;R.receipts[ev.km]=true;log(`${ev.name} 通過 ${fmt(R.t)}`)})}
  if(ev.type==="sight")return sightEvent(ev);
  if(ev.type==="friend")return friendEvent(ev);
  if(ev.type==="lodge")return lodgeEvent(R.course.lodges[ev.li],ev.li);
  if(ev.type==="goal")return goal(ev);
}
function sightEvent(ev){
  const left=R.course.start+R.course.limit-R.t;
  menu({title:ev.name,text:`${ev.text}\nゴールのクローズまで あと${dur(left)}`,items:[
    {label:"立ち寄る",note:`${ev.min}分${ev.price?" "+yen(ev.price):""}`,disabled:ev.price>P.money,fn:()=>{R.t+=ev.min;P.money-=ev.price;fx(ev.fx);if(ev.fx&&ev.fx.hunger>=30)R.lastMeal=R.t;SFX.ok();log(`${ev.name}に立ち寄った。気力が回復！`)}},
    {label:"先を急ぐ",fn:()=>log(`${ev.name}はまた今度。`)}]});
}
function joinTrain(id,km){if(R.train.find(m=>m.id===id))return;R.train.push({id,until:R.km+km});SFX.friend();log(`${FRIENDS[id].name}とトレインを組んだ！`)}
function gainFp(id,n){P.fp[id]=clamp(P.fp[id]+n,0,100);if(n>0)log(`${FRIENDS[id].name}との友情 +${n}`)}
function friendEvent(ev){
  const id=ev.fid,F=FRIENDS[id];if(R.train.find(m=>m.id===id))return;
  const after=(n,km)=>{gainFp(id,n);if(n>=12)joinTrain(id,km||rnd(25,60))};
  const items=[];let text="";
  if(F.trouble==="puncture"){
    text=`${F.name}がパンクで止まっている。予備チューブを使い切ったらしい……。`;
    if(R.tubes>0)items.push({label:"チューブを渡して一緒に直す",note:"12分",desc:"自分のチューブが1本減る。",fn:()=>{R.tubes--;R.t+=12;after(30)}});
    if(R.kit)items.push({label:"パッチ当てを手伝う",note:"20分",fn:()=>{R.t+=20;after(22)}});
  }else if(F.trouble==="hunger"){
    text=`${F.name}が道端でうずくまっている。ハンガーノックらしい。`;
    R.pocket.forEach((p,i)=>items.push({label:`${p.name}を分ける`,note:"3分",fn:()=>{R.pocket.splice(i,1);R.t+=3;after(30)}}));
    items.push({label:"次のPCまで一緒に走る",desc:"トレインを組んでゆっくり引っ張る。",fn:()=>{const nc=nextControl();gainFp(id,15);joinTrain(id,nc?nc.km-R.km:20)}});
  }else if(F.trouble==="cold"){
    text=`${F.name}が寒さで震えている。下りで体が冷えたらしい。`;
    if(R.kairo>0)items.push({label:"カイロを渡す",note:"2分",fn:()=>{R.kairo--;R.t+=2;after(30)}});
    if(R.wind&&!R.windOn)items.push({label:"ウインドブレーカーを貸す",desc:"自分はもう着られなくなる。",fn:()=>{R.wind=false;R.t+=2;after(40)}});
    items.push({label:"一緒に走って温まろう",fn:()=>{gainFp(id,12);joinTrain(id,rnd(15,30))}});
  }else if(F.trouble==="light"){
    text=`${F.name}「ライトが点かない！ これじゃ車検に通らないよ……」`;
    items.push({label:"一緒に原因を調べる",note:"4分",fn:()=>{R.t+=4;
      if(P.gear.light_hi||Math.random()<0.5){say("原因がわかった！","スイッチロックがかかっていただけだった！\n長押しで解除。",()=>after(30))}
      else if(R.batteries>0){say("電池切れだった","予備の単4電池を1本あげた。",()=>{R.batteries--;after(30)})}
      else say("わからない……",`${F.name}は予備ライトを探しに行った。`,()=>gainFp(id,10))}});
  }
  items.push({label:"「がんばって！」と声をかけて先へ",fn:()=>gainFp(id,2)});
  SFX.friend();menu({title:`仲間のピンチ：${F.name}`,text,items});
}

/* ================= PC (convenience store) ================= */
function arrivePC(ev){
  const close=closeOf(ev.km);
  G.mode="pc";R.pc=ev;R.pcArrive=R.t;R.pcLast="";R.pcBought=[];SFX.pc();
  log(`${ev.name} 到着 ${fmt(R.t)}（クローズ目安 ${fmt(close)}）`);
  if(R.t>close){R.pcLast=`クローズ目安 ${fmt(close)} を過ぎてしまった。ゴールの制限時間に注意！`;fx({spirit:-5})}
  pcMenu(false);
}
function pcAct(msg,min){R.pcLast=min?`${msg}（${min}分経過）`:msg;beep(1568,0.05);pcMenu(true)}
function pcMenu(keep){
  const ev=R.pc,list=[...(STORE[ev.chain]||[]),...STORE.common],items=[];
  const seated=it=>it.fx?{...it.fx,stamina:(it.fx.stamina||0)+Math.round(it.min*1.2)}:it.fx;

function startRun(C){
  const L=bestLight(),p=P.pack;
  const events=C.events.map(e=>({...e}));
  // schedule two friend troubles
  const ids=C.race||C.kind==="cafe"||C.dist<60?[]:Object.keys(FRIENDS).sort(()=>Math.random()-0.5).slice(0,C.kind==="brm"?2:1);
  for(const id of ids)events.push({type:"friend",fid:id,km:FRIENDS[id].trouble==="light"?0.05:Math.round(rnd(0.15,0.85)*C.dist*10)/10});
  (C.lodges||[]).forEach((L,li)=>events.push({type:"lodge",km:L.km,li}));
  events.sort((a,b)=>a.km-b.km);
  const pocket=[];for(const it of PACK)if(it.food)for(let i=0;i<(p[it.id]||0);i++)pocket.push({...it.food});
  const fat=P.fatigue||0,smax=Math.round(P.staMax*(1-fat/250));
  R={course:C,t:C.start-25,km:0,pace:"normal",stamina:smax,staMax:smax,hunger:breakfastOf().hunger,spirit:Math.round(100-fat*0.4),temp:100,
    light:L.light.hours,lightMax:L.light.hours,lightType:L.light.type,lightNight:Math.min(1,L.light.night+(P.gear.helmet_light?0.03:0)),backup:frontLights()[1]||null,phone:100,bank:p.bank?2:0,
    kit:p.kit>0,tubes:(p.kit?1:0)+(p.tube||0),link:p.link>0,wind:p.wind>0,windOn:false,rainGear:p.rain>0,rainOn:false,batteries:p.battery||0,kairo:p.kairo||0,whistle:p.whistle>0,
    pocket,load:packWeight(p),receipts:{},train:[],events,evIdx:0,f:{},log:[],cool:3,deer:false,windDay:{dir:rnd(0,360),spd:rnd(1,6.5)},meals:{},lastMeal:C.start,lodge:C.lodges&&P.lodgePick>=0&&P.lodgePick<C.lodges.length?P.lodgePick:null,
    sleepy:C.start<5*60?30:C.start>=20*60?25:0};
  if(C.rain)R.rainZones=C.rain;
  else if(Math.random()<(C.rainChance??0.25)){const a=rnd(0.05,0.7)*C.dist;R.rainZones=[[a,a+rnd(0.15,0.35)*C.dist]]}
  G.mode="pre";G.ff=1;$("#c-ff").textContent="×1";
  {const bf=breakfastOf();P.money-=packCost(p)+lodgeCost(C)+bf.price;fx({spirit:bf.spirit,temp:bf.temp,stamina:bf.stamina,sleepy:bf.sleepy})}
  // friends who offer to ride together at the start
  const buddies=C.race||C.kind==="cafe"?[]:Object.keys(FRIENDS).filter(id=>P.fp[id]>=(C.kind==="brm"?40:15)&&Math.random()<0.6);
  const steps=[];
  steps.push(()=>say(`${C.date} ${C.startName}`,`${breakfastOf().text}\n${C.kind==="brm"?`スタート受付で車検を受ける。ヘルメットよし、ベルよし、前照灯${frontLights().length>=2?"2灯":""}よし、尾灯よし、反射ベストよし${C.cls>=400?"、ヘルメット尾灯よし":""}！`:C.kind==="cafe"?`近所の公園で${FRIENDS[C.friend].name}と待ち合わせ。のんびり行こう。`:C.race?"ゼッケンをつけてスタートラインに並ぶ。":"受付でゼッケンとおみやげ引換券をもらった。"}${fat>=40?`\n疲れが残っている（疲労${Math.round(fat)}）。体力の上限が下がっている。`:""}`,next));
  for(const id of buddies)steps.push(()=>{SFX.friend();menu({title:"トレインのお誘い",text:`${FRIENDS[id].name}「一緒に行きませんか？」`,items:[{label:"一緒に走る",fn:()=>{R.train.push({id,until:rnd(30,90)});next()}},{label:"今日はソロで",fn:next}]})});
  steps.push(()=>say("ブリーフィング終了",`${fmt(C.start)} スタート！ 制限時間 ${dur(C.limit)}。\nゴールクローズは ${fmt(tod(C.start+C.limit))}。\n今日の風：${compass(R.windDay.dir)}の風 ${R.windDay.spd.toFixed(1)}m/s${R.rainZones?"\n予報：途中から雨":"\n予報：晴れ"}${C.race?"\nレースだ。「がんばる」で行こう！":""}`,()=>{R.t=C.start;G.mode="ride";for(const m of R.train)log(`${FRIENDS[m.id].name}とトレインを組んでスタート！`);log("スタート！ 安全第一で。");SFX.ok()}));
  let si=0;function next(){const s=steps[si++];if(s)s()}
  showRideUI(true);updatePaceBtns();next();
}
function recOf(id){return P.rec[id]||(P.rec[id]={done:0,dnf:0,best:null})}
function goal(ev){
  const C=R.course,close=C.start+C.limit,el=R.t-C.start;
  if(C.race)return raceResult(el);
  if(C.kind==="cafe"){SFX.win();G.mode="goal";P.fp[C.friend]=clamp(P.fp[C.friend]+12,0,100);
    return endRun("楽しかった！",`${FRIENDS[C.friend].name}とのカフェライド。\n「次のブルベ、一緒に走りましょう」\n${FRIENDS[C.friend].name}との友情 +12`,{fatigue:4})}
  if(C.kind!=="brm"){SFX.win();G.mode="goal";Object.keys(FRIENDS).forEach(id=>{if(R.train.some(m=>m.id===id)||Math.random()<0.4)P.fp[id]=clamp(P.fp[id]+8,0,100)});
    return endRun(`完走！ ${dur(el)}`,`${C.name}を走りきった。\nゴール会場で仲間たちとおしゃべり。友情が少し深まった。${C.ev&&C.ev.id==="assabu"?"\n石窯ピザと焼肉食べ放題、そして豪華すぎるおみやげ。":""}`,{fatigue:Math.round(C.dist/12),spirit:true})}
  if(R.t>close)return dnf(`${ev.name} ${fmt(R.t)} 着。制限時間 ${fmt(close)} を過ぎての時間外ゴール。認定はもらえなかった……。`);
  const miss=controls().filter(c=>!R.receipts[c.km]);
  if(miss.length)return dnf(`通過証明が足りない：${miss.map(m=>m.name).join("、")}`);
  const r=recOf(C.id);r.done++;if(r.best==null||el<r.best)r.best=el;
  P.seasonDone[C.cls]=(P.seasonDone[C.cls]||0)+1;
  SFX.win();G.mode="goal";
  endRun(`完走！ ${dur(el)}`,`${ev.name} ${fmt(tod(R.t))} 着。\n${C.goalFood}\n認定おめでとう！`,{fatigue:Math.round(C.dist/8),grow:C.dist});
}
// Rank against a field of typical amateurs, simulated on the same course and weather.
function refTime(){
  const sP=P,sR=R;let t=0;
  P=Object.assign(newPlayer(),{bike:"alu",bikes:["alu"],leg:22,body:70,climb:0.03});
  R=Object.assign({},sR,{pace:"hard",stamina:100,staMax:100,hunger:100,temp:100,spirit:100,train:[],load:0.3});
  const d=R.course.dist;for(let km=0;km<d;km+=d/400){R.km=km;t+=d/400/speed()*60}
  P=sP;R=sR;return t;
}
function raceResult(el){
  const C=R.course,ref=refTime(),r=ref/el,pct=clamp(50+(r-1)*220,0.3,99.7),n=C.field,rank=Math.max(1,Math.min(n,Math.round((100-pct)/100*n)));
  const rec=recOf(C.id);if(rec.best==null||el<rec.best)rec.best=el;rec.done++;
  let prize="",bonus={};
  if(rank<=3){prize=`\n表彰台！ 副賞で地元の名産品と賞金 ${yen(10000)} をもらった。`;P.money+=10000}
  else if(rank<=n*0.1)prize="\n上位10%！ 仲間に自慢できる。";
  if(C.kind==="hill")P.climb=Math.min(0.3,P.climb+0.01);
  SFX.win();G.mode="goal";
  endRun(`${rank}位 / ${n}人`,`${C.name}　タイム ${Math.floor(el)}分${String(Math.round((el%1)*60)).padStart(2,"0")}秒\n（参考：真ん中くらいの参加者 ${Math.round(ref)}分）${prize}`,{fatigue:15,...bonus});
}
function dnf(reason){if(G.mode==="dnf"||G.mode==="goal")return;recOf(R.course.id).dnf++;SFX.bad();G.mode="dnf";
  endRun("DNF",reason+`\n${R.course.kind==="brm"?"回収してもらって帰路についた。次こそは。":"スタッフの車で会場に戻った。"}`,{fatigue:Math.round(R.km/8)})}
function endRun(title,text,o={}){
  P.km+=Math.round(R?R.km:0);
  if(R&&R.km>20){const b=R.km/1000;P.body=clamp(P.body-b,55,95)}
  P.fatigue=clamp((P.fatigue||0)+(o.fatigue||0),0,100);
  let extra="";
  if(o.grow){const g=o.grow/200;P.leg=Math.min(32,P.leg+0.15*g);P.staMax=Math.min(160,P.staMax+Math.round(2*g));extra=`\n長距離を走って脚が少し強くなった（巡航 ${P.leg.toFixed(1)}km/h、持久力 ${P.staMax}）。`}
  save();
  menu({title,text:text+extra+`\n疲労 ${Math.round(P.fatigue)}`,items:[{label:"家に帰る",fn:()=>{R=null;nextWeek()}}]});
}

const cv=$("#cv"),ctx=cv.getContext("2d");ctx.imageSmoothingEnabled=false;
const W=256,H=160,HOR=92;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x0,y0,x1,y1,c,t=1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let err=dx+dy;ctx.fillStyle=c;
  for(let n=0;n<400;n++){ctx.fillRect(x0,y0,t,t);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}}
function ring(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);let x=r,y=0,e=1-r;ctx.fillStyle=c;
  while(x>=y){for(const [a,b] of [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]])ctx.fillRect(cx+a,cy+b,1,1);y++;if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1}}}
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};

function palette(t){

  const night=d<C.sunrise-20||d>C.sunset+20;
  if(night)return {night:true,sky:["#000000","#000000","#00007c","#0000bc"],far:"#00007c",far2:"#000058",sea:"#0000bc",wave:"#6888fc",field:"#004058",field2:"#003838",tree:"#002828",road:"#3c3c3c",curb:"#545454",line:"#bcbcbc",ground:"#002800",bld:"#1c1c3c",win:"#f8d878",snow:"#6888fc",pole:"#545454"};
  if(dusk)return {sky:["#4428bc","#940084","#e45c10","#fca044"],far:"#503000",far2:"#881400",sea:"#a81000",wave:"#fca044",field:"#ac7c00",field2:"#887000",tree:"#503000",road:"#545454",curb:"#7c7c7c",line:"#fcfcfc",ground:"#503000",bld:"#4428bc",win:"#f8d878",snow:"#f8b8f8",pole:"#3c3c3c"};
  if(wet)return {sky:["#545454","#7c7c7c","#7c7c7c","#bcbcbc"],far:"#545454",far2:"#006800",sea:"#004058",wave:"#bcbcbc",field:"#00a800",field2:"#007800",tree:"#004000",road:"#545454",curb:"#7c7c7c",line:"#bcbcbc",ground:"#007800",bld:"#7c7c7c",win:"#bcbcbc",snow:"#bcbcbc",pole:"#3c3c3c",wet:true};
  return {sky:["#3cbcfc","#3cbcfc","#68d0fc","#a4e4fc"],far:"#008888",far2:"#00a844",sea:"#0078f8",wave:"#a4e4fc",field:"#58d854",field2:"#00b800",tree:"#005800",road:"#7c7c7c",curb:"#bcbcbc",line:"#fcfcfc",ground:"#00a800",bld:"#bcbcbc",win:"#3cbcfc",snow:"#fcfcfc",pole:"#503000"};
}
function drawSky(p,t){
  const b=[0,26,52,74,HOR];for(let i=0;i<4;i++)rect(0,b[i],W,b[i+1]-b[i],p.sky[i]);
  if(p.night){for(let i=0;i<40;i++){const x=hash(i)*W,y=hash(i+99)*70;if(hash(i+7+Math.floor(performance.now()/700))>0.15)rect(x,y,1,1,"#fcfcfc")}
    rect(210,14,8,8,"#f8d878");rect(212,14,6,6,p.sky[0]);}
  else if(!p.wet){const d=tod(t)/60,sx=20+((d-5)/14)*216;rect(sx,40-Math.sin(Math.PI*(d-5)/14)*28,8,8,"#f8d878");
    for(let i=0;i<3;i++){const cx=((i*97-G.scroll*0.05)%300+300)%300-30,cy=14+i*11;rect(cx,cy,26,5,"#fcfcfc");rect(cx+5,cy-3,14,4,"#fcfcfc")}}
}
function mountains(off,base,amp,c,step=2,snow=null){
  for(let x=0;x<W;x+=step){const w=x+off;const h=base+amp*(Math.sin(w/41)*0.6+Math.sin(w/17+1.3)*0.3+Math.sin(w/7.3)*0.1);
    rect(x,HOR-h,step,h,c);if(snow&&h>base+amp*0.55)rect(x,HOR-h,step,3,snow)}
}
function drawFar(scen,p){
  const s=G.scroll;
  if(scen==="sea"){mountains(s*0.04,8,6,p.far,2);rect(0,HOR-8,W,8+20,p.sea);for(let i=0;i<26;i++){const x=((i*53-s*0.35)%W+W)%W,y=HOR-6+(i%5)*5;rect(x,y,5,1,p.wave)}}
  else if(scen==="lake"){mountains(s*0.05,26,16,p.far,2,p.snow);mountains(s*0.1,12,8,p.far2,2);rect(0,HOR-6,W,26,p.sea);for(let i=0;i<14;i++){const x=((i*71-s*0.3)%W+W)%W;rect(x,HOR-3+(i%3)*6,8,1,p.wave)}}
  else if(scen==="mountain"){mountains(s*0.04,40,22,p.far,2,p.snow);mountains(s*0.1,22,12,p.far2,2);rect(0,HOR,W,20,p.tree)}
  else if(scen==="forest"){mountains(s*0.05,24,10,p.far,2);mountains(s*0.12,14,6,p.far2,2);rect(0,HOR,W,20,p.tree)}
  else if(scen==="field"){mountains(s*0.03,10,6,p.far,2,p.snow);for(let y=HOR;y<112;y+=4)rect(0,y,W,4,((y/4)|0)%2?p.field:p.field2);
    for(let i=0;i<6;i++){const x=((i*61-s*0.6)%(W+40)+W+40)%(W+40)-20,y=100+(i%2)*4;rect(x,y,7,6,p.night?"#545454":"#f0d0b0");rect(x+1,y+1,5,1,p.night?"#3c3c3c":"#ac7c00")}}
  else{ // town
    mountains(s*0.03,14,6,p.far,2);
    for(let i=-1;i<12;i++){const wx=Math.floor(s*0.4/32)+i,x=wx*32-s*0.4,h=14+Math.floor(hash(wx)*26);rect(x,HOR+18-h,28,h,p.bld);
      for(let yy=HOR+18-h+3;yy<HOR+14;yy+=5)for(let xx=x+3;xx<x+26;xx+=6)if(!p.night||hash(wx*7+yy+xx)>0.4)rect(xx,yy,3,2,p.win)}
    rect(0,HOR+18,W,2,p.curb);
  }
}
function drawMid(scen,p){
  const s=G.scroll;
  const gap=scen==="forest"||scen==="mountain"?36:64;
  for(let i=-1;i<W/gap+2;i++){const wx=Math.floor(s/gap)+i,x=wx*gap-s+hash(wx)*10;
    if(scen==="forest"||scen==="mountain"){const hh=18+hash(wx+3)*10;for(let k=0;k<hh;k+=3){const ww=2+k*0.55;rect(x-ww/2,112-hh+k,ww,3,p.tree)}rect(x-1,112,2,2,"#503000")}
    else{rect(x,82,2,30,p.pole);rect(x-5,84,12,1,p.pole)}}
}
function drawRoad(p){
  rect(0,112,W,3,p.curb);rect(0,115,W,30,p.road);
  for(let x=-((G.scroll)%24);x<W;x+=24)rect(x,129,12,2,p.line);
  rect(0,145,W,15,p.ground);
  for(let i=0;i<20;i++){const x=((i*29-G.scroll)%W+W)%W;rect(x,148+(i%4)*3,2,1,p.night?"#004000":"#58d854")}
}
function drawStore(x,chain,p){
  const by=113;rect(x,by-30,52,30,p.night?"#bcbcbc":"#fcfcfc");
  const st={seven:["#f83800","#00a800","#fca044"],lawson:["#0058f8","#0058f8","#fcfcfc"],famima:["#0078f8","#00a800","#fcfcfc"],seicomart:["#fca044","#f83800","#fca044"]}[chain]||["#7c7c7c","#7c7c7c","#7c7c7c"];
  rect(x,by-30,52,3,st[0]);rect(x,by-27,52,3,st[1]);rect(x,by-24,52,2,st[2]);
  rect(x+4,by-18,18,18,"#3cbcfc");rect(x+28,by-18,20,10,"#3cbcfc");if(p.night){rect(x+4,by-18,18,18,"#f8d878");rect(x+28,by-18,20,10,"#f8d878")}
  rect(x+56,by-26,3,26,"#7c7c7c");rect(x+52,by-34,11,10,st[0]);
}
function drawSign(x,c){rect(x+7,95,2,18,"#503000");rect(x,86,16,10,c);rect(x+2,88,12,1,"#fcfcfc");rect(x+2,91,9,1,"#fcfcfc")}
function drawGoal(x){rect(x,74,3,40,"#fcfcfc");rect(x+40,74,3,40,"#fcfcfc");for(let i=0;i<10;i++)rect(x+3+i*4,74,4,6,(i%2)?"#000":"#fcfcfc");for(let i=0;i<10;i++)rect(x+3+i*4,80,4,4,(i%2)?"#fcfcfc":"#000")}
function drawDeer(x){const y=112;rect(x,y-14,14,6,"#ac7c00");rect(x+12,y-20,5,6,"#ac7c00");rect(x+13,y-24,1,4,"#503000");rect(x+16,y-24,1,4,"#503000");
  for(const l of [1,4,9,12])rect(x+l,y-8,2,8,"#ac7c00");rect(x+15,y-18,1,1,"#fcfcfc")}
function drawRider(x,gy,jersey,frame,crank,night,pose,helmet="#fcfcfc",vest=false){
  const wy=gy-8,fx=x+23,bb={x:x+11,y:wy+1},seat={x:x+8,y:wy-11},head={x:x+20,y:wy-10};
  for(const cx of [x,fx]){ring(cx,wy,8,"#000");ring(cx,wy,7,"#3c3c3c");ring(cx,wy,6,night?"#7c7c7c":"#bcbcbc");
    const a=crank*1.7+cx;line(cx-Math.cos(a)*5,wy-Math.sin(a)*5,cx+Math.cos(a)*5,wy+Math.sin(a)*5,"#bcbcbc");line(cx-Math.sin(a)*5,wy+Math.cos(a)*5,cx+Math.sin(a)*5,wy-Math.cos(a)*5,"#bcbcbc")}
  const hip={x:x+8,y:wy-15},P2={up:[17,-23,21,-27],climb:[16,-24,20,-28],dh:[19,-19,24,-21],dance:[18,-25,22,-29]}[pose||"up"],sh={x:x+P2[0],y:wy+P2[1]},hd={x:x+P2[2],y:wy+P2[3]};
  // far leg
  const leg=(a,c)=>{const pd={x:bb.x+Math.cos(a)*4,y:bb.y+Math.sin(a)*4};const dx=pd.x-hip.x,dy=pd.y-hip.y,d=Math.min(17.5,Math.hypot(dx,dy));
    const base=Math.atan2(dy,dx),k=Math.acos(clamp((81+d*d-81)/(2*9*d),-1,1));const kn={x:hip.x+Math.cos(base-k)*9,y:hip.y+Math.sin(base-k)*9};
    line(hip.x,hip.y,kn.x,kn.y,c,2);line(kn.x,kn.y,pd.x,pd.y,c,2);rect(pd.x-2,pd.y,4,1,"#000")};
  leg(crank+Math.PI,"#1c1c1c");
  line(x,wy,bb.x,bb.y,frame,2);line(x,wy,seat.x,seat.y,frame);line(seat.x,seat.y,bb.x,bb.y,frame,2);line(seat.x,seat.y,head.x,head.y,frame,2);line(bb.x,bb.y,head.x,head.y,frame,2);line(head.x,head.y,fx,wy,frame,2);
  rect(seat.x-3,seat.y-2,7,2,"#000");line(head.x,head.y,head.x+3,head.y-3,"#7c7c7c");rect(head.x+3,head.y-3,2,4,"#000");
  line(hip.x,hip.y,sh.x,sh.y,jersey,3);
  if(vest){line(hip.x,hip.y-1,sh.x-1,sh.y+1,"#b8f818",3);line(hip.x+2,hip.y-5,sh.x-1,sh.y+4,night?"#fcfcfc":"#bcbcbc",1)}
  if(pose==="dh"){rect(head.x+1,head.y-5,7,1,"#000");line(sh.x,sh.y,head.x+5,head.y-6,jersey,2)}else line(sh.x,sh.y,head.x+4,head.y-2,jersey,2);
  if(pose==="dance"&&Math.floor(performance.now()/200)%3===0)rect(hd.x-6,hd.y-2,1,2,"#3cbcfc");
  rect(hd.x-3,hd.y-1,6,5,"#f0d0b0");rect(hd.x-4,hd.y-3,8,3,helmet);rect(hd.x-4,hd.y-3,8,1,helmet==="#fcfcfc"?jersey:"#fcfcfc");if(P&&P.gear&&P.gear.helmet_light&&night)rect(hd.x+3,hd.y-4,2,1,"#f8d878");rect(hd.x+1,hd.y+1,3,1,"#000");
  leg(crank,"#000");
  if(night&&Math.floor(performance.now()/300)%2)rect(seat.x-4,seat.y+1,2,2,"#f83800");
}
// Rain streaks lean with the wind; wind streaks fly past faster in a headwind.
function drawWeather(dt){
  const hw=windNow(),v=G.mode==="ride"&&!UI.open?speed():0;
  G.wx=(G.wx||0)+((v/3.6)+hw)*dt*14;
  if(raining()){const lean=clamp(hw,-6,6);for(let i=0;i<70;i++){const x=((hash(i)*W*1.3-G.wx*0.6+performance.now()/9*(i%3+1))%W+W)%W,y=(hash(i+50)*H+performance.now()/4*(1+i%2))%H;line(x,y,x+2+lean*0.4,y+6,"#a4e4fc")}}
  if(Math.abs(hw)>1.5){const n=Math.min(10,Math.round(Math.abs(hw)*1.5));for(let i=0;i<n;i++){const x=((hash(i+200)*W-G.wx)%W+W)%W,y=20+hash(i+300)*90;rect(x,y,hw>0?8:5,1,"#fcfcfc")}}
}
function drawMini(){
  const C=R.course,x0=168,y0=4,w=84,h=22;rect(x0-1,y0-1,w+2,h+2,"#fcfcfc");rect(x0,y0,w,h,"#000");
  const maxE=Math.max(...C.profile.map(p=>p[1]),200);
  for(let i=0;i<w;i++){const km=C.dist*i/w;let e=0;const pp=C.profile;for(let j=1;j<pp.length;j++)if(km<=pp[j][0]){e=pp[j-1][1]+(pp[j][1]-pp[j-1][1])*(km-pp[j-1][0])/(pp[j][0]-pp[j-1][0]);break}
    const hh=Math.max(1,Math.round(e/maxE*(h-4)));rect(x0+i,y0+h-hh,1,hh,"#00a800")}
  for(const e of C.events)if(e.type==="pc")rect(x0+Math.round(e.km/C.dist*w),y0,1,h,"#f8b800");
  if(Math.floor(performance.now()/250)%2)rect(x0+Math.round(R.km/C.dist*w)-1,y0+1,3,3,"#f83800");
}
function drawLogo(){
  ctx.font='16px "DotGothic16",monospace';ctx.textAlign="center";
  ctx.fillStyle="#000";ctx.fillText("BREVET QUEST",W/2+2,36);ctx.fillStyle="#f8b800";ctx.fillText("BREVET QUEST",W/2,34);
  ctx.font='12px "DotGothic16",monospace';ctx.fillStyle="#000";ctx.fillText("ブルベクエスト 北海道",W/2+1,53);ctx.fillStyle="#fcfcfc";ctx.fillText("ブルベクエスト 北海道",W/2,52);
}
function draw(dt){
  const riding=G.mode==="ride"&&!UI.open&&R;
  const inRun=R&&["ride","pc","pre"].includes(G.mode);
  const t=inRun?R.t:G.bg.tod,scen=inRun?scenAt(R.km):G.bg.scen;
  const v=riding?speed():(inRun?0:G.bg.speed);
  const k=riding?G.ff:1;
  G.scroll+=v*2.4*dt*k;G.crank+=v*0.35*dt*k;
  const p=palette(t);
  drawSky(p,t);drawFar(scen,p);drawMid(scen,p);
  if(inRun){const KM=600;for(const e of R.events){const dx=(e.km-R.km)*KM;if(dx<-90||dx>W)continue;const x=96+dx;
      if(e.type==="pc")drawStore(x-10,e.chain,p);else if(e.type==="goal")drawGoal(x-6);else if(e.type==="check")drawSign(x,"#0058f8");else if(e.type==="sight")drawSign(x+20,"#f83800")}}
  drawRoad(p);
  const night=inRun?isNight(R.t):p.night;
  if(inRun&&night&&R.light>0){ctx.fillStyle="rgba(252,224,168,0.35)";ctx.beginPath();ctx.moveTo(122,119);ctx.lineTo(W,116);ctx.lineTo(W,145);ctx.lineTo(160,145);ctx.fill()}
  if(inRun&&R.deer)drawDeer(190);
  if(inRun)R.train.forEach((m,i)=>drawRider(66-i*28,138,FRIENDS[m.id].color,"#7c7c7c",G.crank+i*1.3,night,"up","#fcfcfc",R.course.kind==="brm"));
  const pose=!inRun?"up":dhOn()?"dh":(R.pace==="hard"&&gradeAt(R.km)>1.5)?"dance":gradeAt(R.km)>3?"climb":"up";
  const LK=P?looks():{jersey:"#f8b800",helmet:"#fcfcfc"};
  drawRider(100,138,LK.jersey,P&&P.bike?frameColor():"#0058f8",G.crank,night,pose,LK.helmet,inRun&&R.course.kind==="brm");
  if(inRun)drawWeather(dt*k);
  if(inRun)drawMini();
  if(G.mode==="title")drawLogo();
}

/* ================= MAIN LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(G.mode==="ride"&&!UI.open&&R)rideTick(dt);
  draw(dt);updateHUD(dt);
  requestAnimationFrame(frame);
}
(document.fonts&&document.fonts.load?document.fonts.load('16px "DotGothic16"').catch(()=>{}):Promise.resolve()).finally(()=>{});
title();requestAnimationFrame(frame);
</script>
